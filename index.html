<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Arvé – Clothing Designer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --black:#080908;
  --dark:#101411;
  --green:#17382d;
  --green2:#244d3d;
  --wine:#641f2b;
  --cream:#eee6d4;
  --gold:#b8a16a;
  --border:rgba(184,161,106,.35);
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% 0%,#1a2b22 0%,transparent 42%),
    var(--black);
  color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
}

body{
  overflow-x:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  color:var(--cream);
  background:#111612;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 13px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

header{
  text-align:center;
  padding:20px 15px 16px;
  border-bottom:1px solid rgba(238,230,212,.12);
}

.logo{
  font-size:34px;
  font-weight:bold;
  letter-spacing:9px;
}

.tagline{
  margin-top:5px;
  font-size:10px;
  letter-spacing:4px;
  opacity:.55;
}

.app{
  width:min(1400px,100%);
  margin:auto;
  padding:15px;
}

.topbar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
}

.topbar button{
  flex:0 0 auto;
}

.topbar button.active{
  background:var(--green);
  border-color:var(--gold);
}

.workspace{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:15px;
}

.stage{
  min-height:700px;
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:20px;
  background:
    radial-gradient(circle at 50% 45%,rgba(36,77,61,.3),transparent 48%),
    #0b0f0c;
  box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.stage-grid{
  position:absolute;
  inset:0;
  opacity:.08;
  background-image:
    linear-gradient(rgba(238,230,212,.25) 1px,transparent 1px),
    linear-gradient(90deg,rgba(238,230,212,.25) 1px,transparent 1px);
  background-size:40px 40px;
}

.stage-title{
  position:absolute;
  top:15px;
  left:18px;
  font-size:11px;
  letter-spacing:3px;
  opacity:.45;
}

.clothing-area{
  position:absolute;
  left:50%;
  top:50%;
  width:min(390px,80vw);
  height:540px;
  transform:translate(-50%,-50%);
  touch-action:none;
}

.garment{
  position:absolute;
  inset:0;
  filter:
    drop-shadow(0 18px 20px rgba(0,0,0,.48))
    drop-shadow(0 3px 4px rgba(0,0,0,.25));
  transition:background .15s;
}

.garment::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      105deg,
      transparent 0%,
      rgba(255,255,255,.10) 35%,
      transparent 48%,
      rgba(0,0,0,.10) 75%,
      transparent 100%
    );
  mix-blend-mode:overlay;
}

.garment.tshirt{
  clip-path:polygon(
    31% 6%,
    39% 3%,
    50% 12%,
    61% 3%,
    69% 6%,
    94% 20%,
    100% 39%,
    87% 48%,
    76% 34%,
    78% 92%,
    22% 92%,
    24% 34%,
    13% 48%,
    0% 39%,
    6% 20%
  );
}

.garment.shirt{
  clip-path:polygon(
    30% 6%,
    40% 3%,
    50% 13%,
    60% 3%,
    70% 6%,
    93% 19%,
    100% 37%,
    88% 46%,
    77% 32%,
    78% 93%,
    22% 93%,
    23% 32%,
    12% 46%,
    0% 37%,
    7% 19%
  );
}

.garment.pants{
  clip-path:polygon(
    24% 4%,
    76% 4%,
    81% 30%,
    70% 100%,
    52% 100%,
    50% 58%,
    48% 100%,
    30% 100%,
    19% 30%
  );
}

.garment-detail{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:3;
}

.collar{
  position:absolute;
  left:50%;
  top:6%;
  width:24%;
  height:12%;
  transform:translateX(-50%);
  border:3px solid rgba(0,0,0,.18);
  border-top:0;
  border-radius:0 0 50% 50%;
}

.button-line{
  position:absolute;
  left:50%;
  top:15%;
  bottom:8%;
  width:2px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.16);
}

.pocket{
  position:absolute;
  left:62%;
  top:32%;
  width:18%;
  height:17%;
  border:2px solid rgba(0,0,0,.18);
}

.waist{
  position:absolute;
  left:22%;
  right:22%;
  top:5%;
  height:3px;
  background:rgba(0,0,0,.18);
}

/* DESIGN ELEMENTS */

.design-layer{
  position:absolute;
  inset:0;
  z-index:8;
  pointer-events:none;
}

.design-text{
  position:absolute;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  color:#111;
  font-size:25px;
  font-weight:bold;
  white-space:nowrap;
  pointer-events:auto;
  user-select:none;
  touch-action:none;
}

.design-sticker{
  position:absolute;
  left:50%;
  top:57%;
  transform:translate(-50%,-50%);
  font-size:52px;
  pointer-events:auto;
  user-select:none;
  touch-action:none;
}

/* VERFORMUNGSPUNKTE */

.control-point{
  position:absolute;
  width:17px;
  height:17px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:var(--gold);
  border:3px solid var(--cream);
  box-shadow:
    0 0 0 4px rgba(184,161,106,.16),
    0 4px 10px rgba(0,0,0,.5);
  z-index:20;
  touch-action:none;
}

.control-point.inner{
  width:13px;
  height:13px;
  background:#d5bf86;
}

/* PANEL */

.panel{
  background:rgba(16,20,17,.94);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px;
  max-height:700px;
  overflow-y:auto;
}

.panel h2{
  margin:0 0 15px;
  font-size:21px;
}

.section{
  padding:14px 0;
  border-top:1px solid rgba(238,230,212,.1);
}

.section:first-of-type{
  border-top:0;
}

.section-title{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  opacity:.55;
  margin-bottom:9px;
}

.row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.row button{
  flex:1 1 auto;
}

.color{
  width:38px;
  height:38px;
  min-width:38px;
  padding:0;
  border-radius:50%;
}

input[type="text"]{
  width:100%;
  padding:12px;
  color:var(--cream);
  background:#080b09;
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
}

.slider{
  width:100%;
}

.small{
  font-size:11px;
  opacity:.5;
  line-height:1.5;
}

.danger{
  border-color:rgba(100,31,43,.7);
}

.save{
  width:100%;
  background:var(--green);
  border-color:var(--gold);
}

@media(max-width:900px){

  .workspace{
    grid-template-columns:1fr;
  }

  .panel{
    max-height:none;
  }

  .stage{
    min-height:620px;
  }
}

@media(max-width:520px){

  .app{
    padding:9px;
  }

  .stage{
    min-height:580px;
    border-radius:15px;
  }

  .clothing-area{
    width:340px;
    height:500px;
  }

  .logo{
    font-size:29px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ARVÉ</div>
  <div class="tagline">CREATE WITHOUT LIMITS</div>
</header>

<div class="app">

  <div class="topbar">
    <button class="active" onclick="selectGarment('tshirt',this)">
      T-Shirt
    </button>

    <button onclick="selectGarment('shirt',this)">
      Hemd
    </button>

    <button onclick="selectGarment('pants',this)">
      Hose
    </button>

    <button onclick="resetEverything()">
      Zurücksetzen
    </button>
  </div>

  <div class="workspace">

    <main class="stage">

      <div class="stage-grid"></div>

      <div class="stage-title">
        ARVÉ / DESIGN STUDIO
      </div>

      <div class="clothing-area" id="clothingArea">

        <div id="garment" class="garment tshirt"></div>

        <div class="garment-detail" id="garmentDetail">
          <div class="collar"></div>
        </div>

        <div class="design-layer">

          <div id="designText" class="design-text"></div>

          <div id="designSticker" class="design-sticker"></div>

        </div>

        <!-- ÄUSSERE PUNKTE -->

        <div class="control-point" data-x="31" data-y="6"></div>
        <div class="control-point" data-x="39" data-y="3"></div>
        <div class="control-point" data-x="50" data-y="12"></div>
        <div class="control-point" data-x="61" data-y="3"></div>
        <div class="control-point" data-x="69" data-y="6"></div>

        <div class="control-point" data-x="94" data-y="20"></div>
        <div class="control-point" data-x="100" data-y="39"></div>
        <div class="control-point" data-x="87" data-y="48"></div>

        <div class="control-point" data-x="76" data-y="34"></div>
        <div class="control-point" data-x="78" data-y="92"></div>

        <div class="control-point" data-x="50" data-y="92"></div>

        <div class="control-point" data-x="22" data-y="92"></div>
        <div class="control-point" data-x="24" data-y="34"></div>

        <div class="control-point" data-x="13" data-y="48"></div>
        <div class="control-point" data-x="0" data-y="39"></div>
        <div class="control-point" data-x="6" data-y="20"></div>

        <!-- INNERE PUNKTE -->

        <div class="control-point inner" data-x="25" data-y="25"></div>
        <div class="control-point inner" data-x="35" data-y="20"></div>
        <div class="control-point inner" data-x="50" data-y="24"></div>
        <div class="control-point inner" data-x="65" data-y="20"></div>
        <div class="control-point inner" data-x="75" data-y="25"></div>

        <div class="control-point inner" data-x="28" data-y="48"></div>
        <div class="control-point inner" data-x="50" data-y="48"></div>
        <div class="control-point inner" data-x="72" data-y="48"></div>

        <div class="control-point inner" data-x="28" data-y="70"></div>
        <div class="control-point inner" data-x="50" data-y="70"></div>
        <div class="control-point inner" data-x="72" data-y="70"></div>

      </div>

    </main>

    <aside class="panel">

      <h2>Design</h2>

      <!-- FARBE -->

      <div class="section">

        <div class="section-title">
          Farbe
        </div>

        <div class="row">

          <button
            class="color"
            style="background:#eee6d4"
            onclick="setColor('#eee6d4')">
          </button>

          <button
            class="color"
            style="background:#111"
            onclick="setColor('#111111')">
          </button>

          <button
            class="color"
            style="background:#17382d"
            onclick="setColor('#17382d')">
          </button>

          <button
            class="color"
            style="background:#641f2b"
            onclick="setColor('#641f2b')">
          </button>

          <button
            class="color"
            style="background:#777"
            onclick="setColor('#777777')">
          </button>

          <button
            class="color"
            style="background:#b8a16a"
            onclick="setColor('#b8a16a')">
          </button>

        </div>

      </div>

      <!-- MUSTER -->

      <div class="section">

        <div class="section-title">
          Muster
        </div>

        <div class="row">

          <button onclick="setPattern('none')">
            Clean
          </button>

          <button onclick="setPattern('stripe')">
            Streifen
          </button>

          <button onclick="setPattern('dots')">
            Punkte
          </button>

          <button onclick="setPattern('grid')">
            Grid
          </button>

          <button onclick="setPattern('diagonal')">
            Diagonal
          </button>

        </div>

      </div>

      <!-- TEXT -->

      <div class="section">

        <div class="section-title">
          Text
        </div>

        <input
          id="textInput"
          type="text"
          placeholder="Dein Text..."
          oninput="updateText()"
        >

        <div class="row" style="margin-top:8px">

          <button onclick="changeTextSize(-2)">
            −
          </button>

          <button onclick="changeTextSize(2)">
            +
          </button>

          <button onclick="clearText()">
            Löschen
          </button>

        </div>

      </div>

      <!-- STICKER -->

      <div class="section">

        <div class="section-title">
          Sticker
        </div>

        <div class="row">

          <button onclick="setSticker('★')">★</button>
          <button onclick="setSticker('✦')">✦</button>
          <button onclick="setSticker('◆')">◆</button>
          <button onclick="setSticker('♛')">♛</button>
          <button onclick="setSticker('✺')">✺</button>

        </div>

      </div>

      <!-- GRÖSSE -->

      <div class="section">

        <div class="section-title">
          Kleidungsgröße
        </div>

        <input
          class="slider"
          id="sizeSlider"
          type="range"
          min="70"
          max="125"
          value="100"
          oninput="changeGarmentSize()"
        >

      </div>

      <!-- SPEICHERN -->

      <div class="section">

        <button class="save" onclick="saveDesign()">
          Design speichern
        </button>

      </div>

      <div class="section">

        <button class="danger" onclick="resetEverything()">
          Alles zurücksetzen
        </button>

      </div>

      <div class="small">
        Die goldenen Punkte sind deine Form-Werkzeuge.
        Ziehe sie mit dem Finger, um die Silhouette individuell
        zu verändern.
      </div>

    </aside>

  </div>

</div>

<script>

/* =========================
   ARVÉ DESIGN ENGINE
========================= */

const garment =
  document.getElementById("garment");

const clothingArea =
  document.getElementById("clothingArea");

const designText =
  document.getElementById("designText");

const designSticker =
  document.getElementById("designSticker");

const points =
  [...document.querySelectorAll(".control-point")];


let currentGarment = "tshirt";

let currentColor = "#eee6d4";

let currentPattern = "none";

let textSize = 25;

let garmentScale = 1;

let activePoint = null;


/* =========================
   KLEIDUNG
========================= */

function selectGarment(type,button){

  currentGarment = type;

  garment.className =
    "garment " + type;

  document
    .querySelectorAll(".topbar button")
    .forEach(b=>{
      b.classList.remove("active");
    });

  button.classList.add("active");

  updateGarmentDetails();

  resetPoints();

}


/* =========================
   DETAILS
========================= */

function updateGarmentDetails(){

  const detail =
    document.getElementById("garmentDetail");

  if(currentGarment === "tshirt"){

    detail.innerHTML =
      '<div class="collar"></div>';

  }

  if(currentGarment === "shirt"){

    detail.innerHTML =
      '<div class="collar"></div>' +
      '<div class="button-line"></div>' +
      '<div class="pocket"></div>';

  }

  if(currentGarment === "pants"){

    detail.innerHTML =
      '<div class="waist"></div>';

  }

}


/* =========================
   FARBE
========================= */

function setColor(color){

  currentColor = color;

  garment.style.background =
    color;

  applyPattern();

}


/* =========================
   MUSTER
========================= */

function setPattern(pattern){

  currentPattern = pattern;

  applyPattern();

}


function applyPattern(){

  if(currentPattern === "none"){

    garment.style.background =
      currentColor;

  }


  if(currentPattern === "stripe"){

    garment.style.background =
      `repeating-linear-gradient(
        45deg,
        ${currentColor},
        ${currentColor} 16px,
        rgba(0,0,0,.17) 16px,
        rgba(0,0,0,.17) 23px
      )`;

  }


  if(currentPattern === "dots"){

    garment.style.background =
      `radial-gradient(
        circle,
        rgba(0,0,0,.30) 3px,
        transparent 4px
      ),
      ${currentColor}`;

    garment.style.backgroundSize =
      "23px 23px";

  }


  if(currentPattern === "grid"){

    garment.style.background =
      `linear-gradient(
        rgba(0,0,0,.16) 1px,
        transparent 1px
      ),
      linear-gradient(
        90deg,
        rgba(0,0,0,.16) 1px,
        transparent 1px
      ),
      ${currentColor}`;

    garment.style.backgroundSize =
      "25px 25px";

  }


  if(currentPattern === "diagonal"){

    garment.style.background =
      `repeating-linear-gradient(
        -45deg,
        ${currentColor},
        ${currentColor} 12px,
        rgba(255,255,255,.10) 12px,
        rgba(255,255,255,.10) 18px
      )`;

  }

}


/* =========================
   TEXT
========================= */

function updateText(){

  designText.textContent =
    document.getElementById("textInput").value;

}


function changeTextSize(amount){

  textSize += amount;

  textSize =
    Math.max(10,Math.min(80,textSize));

  designText.style.fontSize =
    textSize + "px";

}


function clearText(){

  document.getElementById("textInput").value = "";

  designText.textContent = "";

}


/* =========================
   STICKER
========================= */

function setSticker(value){

  designSticker.textContent =
    value;

}


/* =========================
   GRÖSSE
========================= */

function changeGarmentSize(){

  const value =
    document.getElementById("sizeSlider").value;

  garmentScale =
    value / 100;

  garment.style.transform =
    `scale(${garmentScale})`;

}


/* =========================
   VERFORMUNG
========================= */

function positionPoints(){

  points.forEach(point=>{

    point.style.left =
      point.dataset.x + "%";

    point.style.top =
      point.dataset.y + "%";

  });

}


function resetPoints(){

  points.forEach(point=>{

    point.style.left =
      point.dataset.x + "%";

    point.style.top =
      point.dataset.y + "%";

  });

  updateShape();

}


/*
   Jeder Punkt kann mit Finger
   oder Maus gezogen werden.
*/

points.forEach(point=>{

  point.addEventListener(
    "pointerdown",
    startPoint
  );

  point.addEventListener(
    "pointermove",
    movePoint
  );

  point.addEventListener(
    "pointerup",
    endPoint
  );

  point.addEventListener(
    "pointercancel",
    endPoint
  );

});


function startPoint(event){

  event.preventDefault();

  activePoint = this;

  this.setPointerCapture(
    event.pointerId
  );

}


function movePoint(event){

  if(activePoint !== this)
    return;

  const rect =
    clothingArea.getBoundingClientRect();

  let x =
    ((event.clientX - rect.left) /
    rect.width) * 100;

  let y =
    ((event.clientY - rect.top) /
    rect.height) * 100;


  x =
    Math.max(0,Math.min(100,x));

  y =
    Math.max(0,Math.min(100,y));


  this.style.left =
    x + "%";

  this.style.top =
    y + "%";


  updateShape();

}


function endPoint(){

  activePoint = null;

}


/* =========================
   FORM AKTUALISIEREN
========================= */

function updateShape(){

  /*
    Die äußeren Punkte werden
    für die Kleidungs-Silhouette
    verwendet.
  */

  const outer =
    points
      .filter(p =>
        !p.classList.contains("inner")
      );


  const coordinates =
    outer.map(p => {

      const x =
        parseFloat(p.style.left);

      const y =
        parseFloat(p.style.top);

      return `${x}% ${y}%`;

    });


  garment.style.clipPath =
    `polygon(${coordinates.join(",")})`;

}


/* =========================
   SPEICHERN
========================= */

function saveDesign(){

  const design = {

    garment:currentGarment,

    color:currentColor,

    pattern:currentPattern,

    text:
      document.getElementById(
        "textInput"
      ).value,

    sticker:
      designSticker.textContent,

    points:
      points.map(p=>({
        x:p.style.left,
        y:p.style.top
      })),

    size:
      document.getElementById(
        "sizeSlider"
      ).value

  };


  localStorage.setItem(
    "arveDesign",
    JSON.stringify(design)
  );


  alert(
    "Arvé Design gespeichert."
  );

}


/* =========================
   LADEN
========================= */

function loadDesign(){

  const saved =
    localStorage.getItem(
      "arveDesign"
    );

  if(!saved)
    return;


  const design =
    JSON.parse(saved);


  currentGarment =
    design.garment;

  currentColor =
    design.color;

  currentPattern =
    design.pattern;


  garment.className =
    "garment " +
    currentGarment;


  garment.style.background =
    currentColor;


  applyPattern();


  document.getElementById(
    "textInput"
  ).value =
    design.text || "";


  updateText();


  designSticker.textContent =
    design.sticker || "";


  if(design.points){

    design.points.forEach(
      (p,i)=>{

        if(points[i]){

          points[i].style.left =
            p.x;

          points[i].style.top =
            p.y;

        }

      }
    );

  }


  if(design.size){

    document.getElementById(
      "sizeSlider"
    ).value =
      design.size;

    changeGarmentSize();

  }


  updateGarmentDetails();

  updateShape();

}


/* =========================
   RESET
========================= */

function resetEverything(){

  localStorage.removeItem(
    "arveDesign"
  );

  currentGarment =
    "tshirt";

  currentColor =
    "#eee6d4";

  currentPattern =
    "none";

  textSize =
    25;

  garmentScale =
    1;


  garment.className =
    "garment tshirt";


  garment.style.background =
    currentColor;


  garment.style.transform =
    "scale(1)";


  document.getElementById(
    "sizeSlider"
  ).value = 100;


  document.getElementById(
    "textInput"
  ).value = "";


  designText.textContent = "";

  designSticker.textContent = "";


  resetPoints();

  updateGarmentDetails();

}

if(!localStorage.getItem("arveDesign")){
