<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arvé</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --black:#080908;
  --dark:#101411;
  --green:#17382d;
  --green-light:#244d3d;
  --wine:#641f2b;
  --cream:#eee6d4;
  --gold:#b8a16a;
  --border:rgba(184,161,106,.35);
}

body {
  margin:0;
  background:
    radial-gradient(circle at 50% 0%,#16251e,transparent 45%),
    var(--black);
  color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
}

header {
  padding:22px;
  text-align:center;
  border-bottom:1px solid #303831;
}

.logo {
  font-size:32px;
  letter-spacing:7px;
  font-weight:bold;
}

.subtitle {
  color:#aaa99f;
  margin-top:6px;
}

.app {
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.controls {
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  margin-bottom:20px;
}

.panel {
  background:#121814;
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
}

.panel h3 {
  margin-top:0;
  font-size:15px;
  letter-spacing:1px;
}

button {
  font-family:Georgia,"Times New Roman",serif;
  background:#1d2720;
  color:var(--cream);
  border:1px solid #465148;
  border-radius:10px;
  padding:10px 14px;
  margin:4px;
  cursor:pointer;
  transition:.2s;
}

button:hover {
  background:var(--green);
  border-color:var(--gold);
}

button.active {
  background:var(--wine);
  border-color:#8d4655;
}

input {
  width:100%;
  padding:11px;
  border-radius:9px;
  border:1px solid #465148;
  background:#0b0f0d;
  color:white;
  margin-bottom:8px;
}

.colors {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.color {
  width:35px;
  height:35px;
  border-radius:50%;
  border:2px solid #777;
  cursor:pointer;
}

.workspace {
  min-height:600px;
  background:
    radial-gradient(circle at center,rgba(36,77,61,.22),transparent 60%),
    #0c100e;
  border:1px solid var(--border);
  border-radius:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
  overflow:hidden;
}

.clothing-area {
  position:relative;
  width:360px;
  height:460px;
}

.garment-svg {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}

.garment-shape {
  fill:#eee6d4;
  stroke:rgba(184,161,106,.5);
  stroke-width:1.5;
  stroke-linejoin:round;
  transition:fill .2s;
}

.garment-shape.pattern {
  fill:url(#pattern);
}

.deform-point {
  fill:#eee6d4;
  stroke:#17382d;
  stroke-width:3;
  cursor:grab;
  touch-action:none;
}

.deform-point:hover {
  fill:#b8a16a;
}

.deform-point.active {
  fill:#b8a16a;
  stroke:#eee6d4;
}

.element {
  position:absolute;
  cursor:grab;
  user-select:none;
  touch-action:none;
  z-index:20;
}

.element:active {
  cursor:grabbing;
}

.element.selected {
  outline:1px dashed var(--gold);
  outline-offset:7px;
}

.design-text {
  font-size:25px;
  font-weight:bold;
  color:#111;
  white-space:nowrap;
}

.sticker {
  font-size:45px;
}

.element-tools,
.deform-tools {
  display:none;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #303831;
}

.element-tools.visible,
.deform-tools.visible {
  display:block;
}

.status {
  text-align:center;
  color:#aaa99f;
  margin-top:15px;
}

@media(min-width:800px) {
  .controls {
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px) {
  .workspace {
    min-height:520px;
    padding:10px;
  }

  .clothing-area {
    transform:scale(.9);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ARVÉ</div>
  <div class="subtitle">Design your own clothing</div>
</header>

<div class="app">

<div class="controls">

<!-- KLEIDUNG -->
<div class="panel">

<h3>KLEIDUNG</h3>

<button onclick="setGarment('tshirt')" id="tshirtBtn" class="active">
T-Shirt
</button>

<button onclick="setGarment('shirt')" id="shirtBtn">
Hemd
</button>

<button onclick="setGarment('pants')" id="pantsBtn">
Hose
</button>

</div>


<!-- FARBE -->
<div class="panel">

<h3>FARBE</h3>

<div class="colors">

<div class="color"
style="background:#f1eee5"
onclick="changeColor('#f1eee5')"></div>

<div class="color"
style="background:#111111"
onclick="changeColor('#111111')"></div>

<div class="color"
style="background:#173326"
onclick="changeColor('#173326')"></div>

<div class="color"
style="background:#5b1f2a"
onclick="changeColor('#5b1f2a')"></div>

<div class="color"
style="background:#777777"
onclick="changeColor('#777777')"></div>

<div class="color"
style="background:#c9b58a"
onclick="changeColor('#c9b58a')"></div>

</div>

<button onclick="togglePattern()">
Muster
</button>

</div>


<!-- DESIGN -->
<div class="panel">

<h3>DESIGN</h3>

<input
id="textInput"
placeholder="Text eingeben..."
>

<button onclick="addText">
Text hinzufügen
</button>

<button onclick="addSticker('★')">★</button>
<button onclick="addSticker('✦')">✦</button>
<button onclick="addSticker('◆')">◆</button>

<br>

<button onclick="toggleDeformation()" id="deformButton">
🌀 Kleidung verformen
</button>

<div id="deformTools" class="deform-tools">

<strong>VERFORMEN</strong>

<br>

<button onclick="resetDeformation()">
Form zurücksetzen
</button>

</div>

<div id="elementTools" class="element-tools">

<strong>ELEMENT</strong>

<br>

<button onclick="changeElementSize(-.1)">−</button>

<button onclick="changeElementSize(.1)">+</button>

<button onclick="rotateElement(-15)">↺</button>

<button onclick="rotateElement(15)">↻</button>

<button onclick="deleteElement()">🗑</button>

</div>

<br>

<button onclick="saveDesign()">
Design speichern
</button>

<button onclick="resetDesign()">
Alles zurücksetzen
</button>

</div>

</div>


<!-- ARBEITSFLÄCHE -->

<div class="workspace">

<div class="clothing-area" id="clothingArea">

<svg
id="garmentSvg"
class="garment-svg"
viewBox="0 0 360 460"
>

<defs>

<pattern
id="pattern"
width="30"
height="30"
patternUnits="userSpaceOnUse"
patternTransform="rotate(45)"
>

<rect
width="30"
height="30"
fill="#eee6d4"
/>

<rect
x="0"
y="0"
width="15"
height="15"
fill="#c9b58a"
opacity=".35"
/>

</pattern>

</defs>

<polygon
id="garmentShape"
class="garment-shape"
points=""
/>

<g id="deformPoints"></g>

</svg>

</div>

</div>

<div class="status" id="status">
Drücke „Kleidung verformen“, um die Form zu bearbeiten.
</div>

</div>


<script>

const clothingArea =
document.getElementById("clothingArea");

const garmentSvg =
document.getElementById("garmentSvg");

const garmentShape =
document.getElementById("garmentShape");

const deformPointsGroup =
document.getElementById("deformPoints");

const statusText =
document.getElementById("status");

const deformTools =
document.getElementById("deformTools");

const deformButton =
document.getElementById("deformButton");

const elementTools =
document.getElementById("elementTools");

let selectedElement = null;
let deformMode = false;
let garmentType = "tshirt";
let garmentColor = "#eee6d4";
let points = [];


/* =================================
   KLEIDUNGSFORMEN
================================= */

function getGarmentPoints(type) {

  /* ---------- HOSE ---------- */

  if (type === "pants") {

    return [

      [115,70],
      [175,70],
      [180,210],
      [175,390],
      [135,390],
      [130,250],
      [125,390],
      [85,390],
      [80,210]

    ];
  }


  /* ---------- HEMD ---------- */

  if (type === "shirt") {

    return [

      [115,70],
      [145,55],
      [180,82],
      [215,55],
      [245,70],

      [305,135],
      [275,175],
      [245,150],

      [245,400],
      [115,400],

      [115,150],
      [85,175],
      [55,135]

    ];
  }


  /* ---------- T-SHIRT ---------- */

  return [

    [120,75],
    [150,58],
    [180,82],
    [210,58],
    [240,75],

    [295,135],
    [268,175],
    [240,150],

    [240,375],
    [120,375],

    [120,150],
    [92,175],
    [65,135]

  ];
}


/* =================================
   VERFORMUNGSPUNKTE
================================= */

function createDeformationGrid() {

  deformPointsGroup.innerHTML = "";

  const base =
    getGarmentPoints(garmentType);

  points =
    base.map(p => ({

      x:p[0],
      y:p[1],

      originalX:p[0],
      originalY:p[1]

    }));

  renderDeformation();
}


/* =================================
   FORM RENDERN
================================= */

function renderDeformation() {

  const pointString =
    points
      .map(p => `${p.x},${p.y}`)
      .join(" ");

  garmentShape.setAttribute(
    "points",
    pointString
  );

  deformPointsGroup.innerHTML = "";

  if (!deformMode) return;

  points.forEach((point,index) => {

    const circle =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    circle.setAttribute(
      "cx",
      point.x
    );

    circle.setAttribute(
      "cy",
      point.y
    );

    circle.setAttribute(
      "r",
      "7"
    );

    circle.classList.add(
      "deform-point"
    );

    circle.dataset.index =
      index;

    makePointDraggable(
      circle,
      index
    );

    deformPointsGroup.appendChild(
      circle
    );

  });
}


/* =================================
   VERFORMUNG
================================= */

function makePointDraggable(
  circle,
  index
) {

  let dragging = false;

  circle.addEventListener(
    "pointerdown",
    event => {

      event.stopPropagation();

      dragging = true;

      circle.classList.add(
        "active"
      );

      circle.setPointerCapture(
        event.pointerId
      );

    }
  );


  circle.addEventListener(
    "pointermove",
    event => {

      if (!dragging) return;

      const rect =
        garmentSvg.getBoundingClientRect();

      const scaleX =
        360 / rect.width;

      const scaleY =
        460 / rect.height;

      let x =
        (event.clientX - rect.left)
        * scaleX;

      let y =
        (event.clientY - rect.top)
        * scaleY;

      x =
        Math.max(
          10,
          Math.min(350,x)
        );

      y =
        Math.max(
          10,
          Math.min(450,y)
        );

      points[index].x = x;
      points[index].y = y;

      renderDeformation();

      statusText.textContent =
        "Kleidungsform wird verändert.";

    }
  );


  circle.addEventListener(
    "pointerup",
    () => {

      dragging = false;

      circle.classList.remove(
        "active"
      );

    }
  );

}


/* =================================
   VERFORMUNG AN/AUS
================================= */

function toggleDeformation() {

  deformMode =
    !deformMode;

  deformTools.classList.toggle(
    "visible",
    deformMode
  );

  deformButton.classList.toggle(
    "active",
    deformMode
  );

  renderDeformation();

  statusText.textContent =
    deformMode
      ? "Ziehe die Punkte mit dem Finger."
      : "Verformung beendet.";
}


/* =================================
   RESET FORM
================================= */

function resetDeformation() {

  points.forEach(point => {

    point.x =
      point.originalX;

    point.y =
      point.originalY;

  });

  renderDeformation();

  statusText.textContent =
    "Kleidungsform zurückgesetzt.";
}


/* =================================
   KLEIDUNG WECHSELN
================================= */

function setGarment(type) {

  garmentType =
    type;

  document
    .querySelectorAll(
      ".panel:first-child button"
    )
    .forEach(button => {

      button.classList.remove(
        "active"
      );

    });

  document
    .getElementById(
      type + "Btn"
    )
    .classList.add(
      "active"
    );

  createDeformationGrid();

  statusText.textContent =
    "Kleidungsstück geändert.";
}


/* =================================
   FARBE
================================= */

function changeColor(color) {

  garmentColor =
    color;

  garmentShape.classList.remove(
    "pattern"
  );

  garmentShape.style.fill =
    color;

  statusText.textContent =
    "Farbe geändert.";
}


/* =================================
   MUSTER
================================= */

function togglePattern() {

  garmentShape.classList.toggle(
    "pattern"
  );

  if (
    garmentShape.classList.contains(
      "pattern"
    )
  ) {

    statusText.textContent =
      "Muster aktiviert.";

  } else {

    garmentShape.style.fill =
      garmentColor;

    statusText.textContent =
      "Muster deaktiviert.";

  }
}


/* =================================
   TEXT
================================= */

function addText() {

  const input =
    document.getElementById(
      "textInput"
    );

  const text =
    input.value.trim();

  if (!text) return;

  const element =
    document.createElement(
      "div"
    );

  element.className =
    "element design-text";

  element.textContent =
    text;

  element.style.left =
    "130px";

  element.style.top =
    "190px";

  element.dataset.scale =
    "1";

  element.dataset.rotation =
    "0";

  clothingArea.appendChild(
    element
  );

  makeDraggable(
    element
  );

  selectElement(
    element
  );

  input.value = "";

  statusText.textContent =
    "Text hinzugefügt.";
}


/* =================================
   STICKER
================================= */

function addSticker(symbol) {

  const element =
    document.createElement(
      "div"
    );

  element.className =
    "element sticker";

  element.textContent =
    symbol;

  element.style.left =
    "145px";

  element.style.top =
    "230px";

  element.dataset.scale =
    "1";

  element.dataset.rotation =
    "0";

  clothingArea.appendChild(
    element
  );

  makeDraggable(
    element
  );

  selectElement(
    element
  );

  statusText.textContent =
    "Sticker hinzugefügt.";
}


/* =================================
   ELEMENT AUSWÄHLEN
================================= */

function selectElement(element) {

  if (selectedElement) {

    selectedElement.classList
      .remove("selected");

  }

  selectedElement =
    element;

  selectedElement.classList
    .add("selected");

  elementTools.classList
    .add("visible");
}


/* =================================
   ELEMENT VERSCHIEBEN
================================= */

function makeDraggable(element) {

  let dragging = false;

  let startX = 0;
  let startY = 0;

  let startLeft = 0;
  let startTop = 0;


  element.addEventListener(
    "pointerdown",
    event => {

      event.stopPropagation();

      selectElement(
        element
      );

      dragging = true;

      startX =
        event.clientX;

      startY =
        event.clientY;

      startLeft =
        element.offsetLeft;

      startTop =
        element.offsetTop;

      element.setPointerCapture(
        event.pointerId
      );

    }
  );


  element.addEventListener(
    "pointermove",
    event => {

      if (!dragging) return;

      element.style.left =
        startLeft +
        event.clientX -
        startX +
        "px";

      element.style.top =
        startTop +
        event.clientY -
        startY +
        "px";

    }
  );


  element.addEventListener(
    "pointerup",
    () => {

      dragging = false;

    }
  );
}


/* =================================
   ELEMENT GRÖSSE
================================= */

function changeElementSize(amount) {

  if (!selectedElement)
    return;

  let scale =
    parseFloat(
      selectedElement.dataset.scale
    );

  scale += amount;

  scale =
    Math.max(
      .5,
      Math.min(3,scale)
    );

  selectedElement.dataset.scale =
    scale;

  updateElementTransform(
    selectedElement
  );
}


/* =================================
   ELEMENT DREHEN
================================= */

function rotateElement(amount) {

  if (!selectedElement)
    return;

  let rotation =
    parseFloat(
      selectedElement.dataset.rotation
    );

  rotation += amount;

  selectedElement.dataset.rotation =
    rotation;

  updateElementTransform(
    selectedElement
  );
}


/* =================================
   TRANSFORM
================================= */

function updateElementTransform(element) {

  const scale =
    element.dataset.scale;

  const rotation =
    element.dataset.rotation;

  element.style.transform =
    `scale(${scale}) rotate(${rotation}deg)`;
}


/* =================================
   ELEMENT LÖSCHEN
================================= */

function deleteElement() {

  if (!selectedElement)
    return;

  selectedElement.remove();

  selectedElement =
    null;

  elementTools.classList
    .remove("visible");

  statusText.textContent =
    "Element gelöscht.";
}


/* =================================
   SPEICHERN
================================= */

function saveDesign() {

  const design = {

    garmentType:
      garmentType,

    garmentColor:
      garmentColor,

    deformation:
      points,

    elements:[]

  };


  document
    .querySelectorAll(
      ".element"
    )
    .forEach(element => {

      design.elements.push({

        text:
          element.textContent,

        className:
          element.className,

        left:
          element.style.left,

        top:
          element.style.top,

        scale:
          element.dataset.scale,

        rotation:
          element.dataset.rotation

      });

    });


  localStorage.setItem(
    "arveDesign",
    JSON.stringify(design)
  );


  statusText.textContent =
    "✓ Arvé-Design gespeichert.";
}


/* =================================
   ALLES ZURÜCKSETZEN
================================= */

function resetDesign() {

  garmentType =
    "tshirt";

  garmentColor =
    "#eee6d4";

  garmentShape.style.fill =
    garmentColor;

  garmentShape.classList
    .remove("pattern");


  document
    .querySelectorAll(
      ".element"
    )
    .forEach(element =>
      element.remove()
    );


  selectedElement =
    null;

  elementTools.classList
    .remove("visible");


  deformMode =
    false;

  deformTools.classList
    .remove("visible");

  deformButton.classList
    .remove("active");


  document
    .querySelectorAll(
      ".panel:first-child button"
    )
    .forEach(button =>
      button.classList.remove(
        "active"
      )
    );

  document
    .getElementById(
      "tshirtBtn"
    )
    .classList.add(
      "active"
    );


  createDeformationGrid();

  statusText.textContent =
    "Arvé-Design zurückgesetzt.";
}


/* =================================
   START
================================= */

createDeformationGrid();

</script>

</body>
</html>
