<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Arvé – Clothing Designer</title>

<style>

/* =====================================================
   ARVÉ
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --black:#080908;
  --dark:#101411;
  --green:#17382d;
  --green-light:#244d3d;
  --wine:#641f2b;
  --cream:#eee6d4;
  --gold:#b8a16a;
  --border:rgba(184,161,106,.35);
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(
      circle at 50% 0%,
      #1a2b22 0%,
      transparent 42%
    ),
    var(--black);
  color:var(--cream);
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

body{
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  color:var(--cream);
  background:#111612;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 13px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}


/* =====================================================
   HEADER
===================================================== */

header{
  text-align:center;
  padding:20px 15px 16px;
  border-bottom:1px solid rgba(238,230,212,.12);
}

.logo{
  font-size:34px;
  font-weight:bold;
  letter-spacing:9px;
}

.tagline{
  margin-top:5px;
  font-size:10px;
  letter-spacing:4px;
  opacity:.55;
}


/* =====================================================
   APP
===================================================== */

.app{
  width:min(1400px,100%);
  margin:auto;
  padding:15px;
}


/* =====================================================
   KLEIDUNG AUSWÄHLEN
===================================================== */

.topbar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
}

.topbar button{
  flex:0 0 auto;
}

.topbar button.active{
  background:var(--green);
  border-color:var(--gold);
}


/* =====================================================
   WORKSPACE
===================================================== */

.workspace{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:15px;
}


/* =====================================================
   BÜHNE
===================================================== */

.stage{
  position:relative;
  min-height:700px;
  overflow:hidden;

  border:1px solid var(--border);
  border-radius:20px;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(36,77,61,.30),
      transparent 48%
    ),
    #0b0f0c;

  box-shadow:
    0 15px 45px rgba(0,0,0,.35);
}

.stage-grid{
  position:absolute;
  inset:0;

  opacity:.08;

  background-image:
    linear-gradient(
      rgba(238,230,212,.25) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(238,230,212,.25) 1px,
      transparent 1px
    );

  background-size:40px 40px;
}

.stage-title{
  position:absolute;
  top:15px;
  left:18px;

  font-size:11px;
  letter-spacing:3px;
  opacity:.45;
}


/* =====================================================
   KLEIDUNGSBEREICH
===================================================== */

.clothing-area{
  position:absolute;

  left:50%;
  top:50%;

  width:min(390px,80vw);
  height:540px;

  transform:translate(-50%,-50%);

  touch-action:none;
}


/* =====================================================
   KLEIDUNG
===================================================== */

.garment{
  position:absolute;
  inset:0;

  filter:
    drop-shadow(
      0 18px 20px rgba(0,0,0,.48)
    )
    drop-shadow(
      0 3px 4px rgba(0,0,0,.25)
    );

  transition:
    background .15s,
    clip-path .08s;
}

.garment::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      105deg,
      transparent 0%,
      rgba(255,255,255,.10) 35%,
      transparent 48%,
      rgba(0,0,0,.10) 75%,
      transparent 100%
    );

  mix-blend-mode:overlay;
}


/* =====================================================
   T-SHIRT
===================================================== */

.garment.tshirt{
  clip-path:polygon(
    31% 6%,
    39% 3%,
    50% 12%,
    61% 3%,
    69% 6%,
    94% 20%,
    100% 39%,
    87% 48%,
    76% 34%,
    78% 92%,
    50% 92%,
    22% 92%,
    24% 34%,
    13% 48%,
    0% 39%,
    6% 20%
  );
}


/* =====================================================
   HEMD
===================================================== */

.garment.shirt{
  clip-path:polygon(
    30% 6%,
    40% 3%,
    50% 13%,
    60% 3%,
    70% 6%,
    93% 19%,
    100% 37%,
    88% 46%,
    77% 32%,
    78% 93%,
    50% 93%,
    22% 93%,
    23% 32%,
    12% 46%,
    0% 37%,
    7% 19%
  );
}


/* =====================================================
   HOSE
===================================================== */

.garment.pants{
  clip-path:polygon(
    24% 4%,
    38% 4%,
    50% 5%,
    62% 4%,
    76% 4%,
    81% 18%,
    84% 32%,
    78% 52%,
    73% 74%,
    70% 100%,
    52% 100%,
    50% 58%,
    48% 100%,
    30% 100%,
    27% 74%,
    22% 52%,
    16% 32%,
    19% 18%
  );
}


/* =====================================================
   DETAILS
===================================================== */

.garment-detail{
  position:absolute;
  inset:0;

  pointer-events:none;

  z-index:3;
}

.collar{
  position:absolute;

  left:50%;
  top:6%;

  width:24%;
  height:12%;

  transform:translateX(-50%);

  border:
    3px solid rgba(0,0,0,.18);

  border-top:0;

  border-radius:
    0 0 50% 50%;
}

.button-line{
  position:absolute;

  left:50%;
  top:15%;
  bottom:8%;

  width:2px;

  transform:translateX(-50%);

  background:
    rgba(0,0,0,.16);
}

.pocket{
  position:absolute;

  left:62%;
  top:32%;

  width:18%;
  height:17%;

  border:
    2px solid rgba(0,0,0,.18);
}

.waist{
  position:absolute;

  left:22%;
  right:22%;

  top:5%;

  height:3px;

  background:
    rgba(0,0,0,.20);
}

.leg-line{
  position:absolute;

  left:50%;
  top:12%;
  bottom:0;

  width:2px;

  transform:translateX(-50%);

  background:
    rgba(0,0,0,.15);
}


/* =====================================================
   DESIGN ELEMENTE
===================================================== */

.design-layer{
  position:absolute;
  inset:0;

  z-index:8;

  pointer-events:none;
}

.design-text{
  position:absolute;

  left:50%;
  top:43%;

  transform:
    translate(-50%,-50%);

  color:#111;

  font-size:25px;
  font-weight:bold;

  white-space:nowrap;

  pointer-events:auto;

  user-select:none;
  touch-action:none;
}

.design-sticker{
  position:absolute;

  left:50%;
  top:57%;

  transform:
    translate(-50%,-50%);

  font-size:52px;

  pointer-events:auto;

  user-select:none;
  touch-action:none;
}


/* =====================================================
   VERFORMUNGSPUNKTE
===================================================== */

.control-point{
  position:absolute;

  width:18px;
  height:18px;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  background:var(--gold);

  border:
    3px solid var(--cream);

  box-shadow:
    0 0 0 4px
      rgba(184,161,106,.16),
    0 4px 10px
      rgba(0,0,0,.5);

  z-index:20;

  touch-action:none;

  cursor:grab;

  transition:
    transform .1s,
    box-shadow .1s;
}

.control-point:active{
  cursor:grabbing;

  transform:
    translate(-50%,-50%)
    scale(1.25);

  box-shadow:
    0 0 0 7px
      rgba(184,161,106,.18),
    0 5px 12px
      rgba(0,0,0,.55);
}


/* =====================================================
   PANEL
===================================================== */

.panel{
  background:
    rgba(16,20,17,.94);

  border:
    1px solid var(--border);

  border-radius:20px;

  padding:16px;

  max-height:700px;

  overflow-y:auto;
}

.panel h2{
  margin:
    0 0 15px;

  font-size:21px;
}

.section{
  padding:14px 0;

  border-top:
    1px solid
    rgba(238,230,212,.10);
}

.section:first-of-type{
  border-top:0;
}

.section-title{
  font-size:11px;

  letter-spacing:2px;

  text-transform:uppercase;

  opacity:.55;

  margin-bottom:9px;
}

.row{
  display:flex;

  gap:7px;

  flex-wrap:wrap;
}

.row button{
  flex:1 1 auto;
}


/* =====================================================
   FARBEN
===================================================== */

.color{
  width:38px;
  height:38px;

  min-width:38px;

  padding:0;

  border-radius:50%;
}


/* =====================================================
   INPUT
===================================================== */

input[type="text"]{
  width:100%;

  padding:12px;

  color:var(--cream);

  background:#080b09;

  border:
    1px solid var(--border);

  border-radius:9px;

  outline:none;
}

.slider{
  width:100%;
}


/* =====================================================
   BUTTONS
===================================================== */

.save{
  width:100%;

  background:
    var(--green);

  border-color:
    var(--gold);
}

.danger{
  border-color:
    rgba(100,31,43,.7);
}

.small{
  font-size:11px;

  opacity:.5;

  line-height:1.5;
}


/* =====================================================
   IPAD / HANDY
===================================================== */

@media(max-width:900px){

  .workspace{
    grid-template-columns:1fr;
  }

  .panel{
    max-height:none;
  }

  .stage{
    min-height:620px;
  }

}

@media(max-width:520px){

  .app{
    padding:9px;
  }

  .stage{
    min-height:580px;
    border-radius:15px;
  }

  .clothing-area{
    width:340px;
    height:500px;
  }

  .logo{
    font-size:29px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div class="logo">
    ARVÉ
  </div>

  <div class="tagline">
    CREATE WITHOUT LIMITS
  </div>

</header>


<div class="app">


<!-- =====================================================
     KLEIDUNG
===================================================== -->

<div class="topbar">

  <button
    id="tshirtButton"
    class="active"
    onclick="selectGarment('tshirt',this)">

    T-Shirt

  </button>


  <button
    id="shirtButton"
    onclick="selectGarment('shirt',this)">

    Hemd

  </button>


  <button
    id="pantsButton"
    onclick="selectGarment('pants',this)">

    Hose

  </button>


  <button
    onclick="resetEverything()">

    Zurücksetzen

  </button>

</div>


<!-- =====================================================
     WORKSPACE
===================================================== -->

<div class="workspace">


<!-- =====================================================
     BÜHNE
===================================================== -->

<main class="stage">

  <div class="stage-grid"></div>

  <div class="stage-title">
    ARVÉ / DESIGN STUDIO
  </div>


  <div
    class="clothing-area"
    id="clothingArea">


    <!-- KLEIDUNG -->

    <div
      id="garment"
      class="garment tshirt">
    </div>


    <!-- DETAILS -->

    <div
      class="garment-detail"
      id="garmentDetail">

      <div class="collar"></div>

    </div>


    <!-- DESIGN -->

    <div class="design-layer">

      <div
        id="designText"
        class="design-text">
      </div>

      <div
        id="designSticker"
        class="design-sticker">
      </div>

    </div>


    <!-- =================================================
         ÄUSSERE VERFORMUNGSPUNKTE
    ================================================= -->

    <div
      class="control-point"
      data-index="0">
    </div>

    <div
      class="control-point"
      data-index="1">
    </div>

    <div
      class="control-point"
      data-index="2">
    </div>

    <div
      class="control-point"
      data-index="3">
    </div>

    <div
      class="control-point"
      data-index="4">
    </div>

    <div
      class="control-point"
      data-index="5">
    </div>

    <div
      class="control-point"
      data-index="6">
    </div>

    <div
      class="control-point"
      data-index="7">
    </div>

    <div
      class="control-point"
      data-index="8">
    </div>

    <div
      class="control-point"
      data-index="9">
    </div>

    <div
      class="control-point"
      data-index="10">
    </div>

    <div
      class="control-point"
      data-index="11">
    </div>

    <div
      class="control-point"
      data-index="12">
    </div>

    <div
      class="control-point"
      data-index="13">
    </div>

    <div
      class="control-point"
      data-index="14">
    </div>

    <div
      class="control-point"
      data-index="15">
    </div>

    <div
      class="control-point"
      data-index="16">
    </div>


  </div>

</main>


<!-- =====================================================
     PANEL
===================================================== -->

<aside class="panel">

  <h2>
    Design
  </h2>


  <!-- FARBE -->

  <div class="section">

    <div class="section-title">
      Farbe
    </div>

    <div class="row">

      <button
        class="color"
        style="background:#eee6d4"
        onclick="setColor('#eee6d4')">
      </button>

      <button
        class="color"
        style="background:#111111"
        onclick="setColor('#111111')">
      </button>

      <button
        class="color"
        style="background:#17382d"
        onclick="setColor('#17382d')">
      </button>

      <button
        class="color"
        style="background:#641f2b"
        onclick="setColor('#641f2b')">
      </button>

      <button
        class="color"
        style="background:#777777"
        onclick="setColor('#777777')">
      </button>

      <button
        class="color"
        style="background:#b8a16a"
        onclick="setColor('#b8a16a')">
      </button>

    </div>

  </div>


  <!-- MUSTER -->

  <div class="section">

    <div class="section-title">
      Muster
    </div>

    <div class="row">

      <button onclick="setPattern('none')">
        Clean
      </button>

      <button onclick="setPattern('stripe')">
        Streifen
      </button>

      <button onclick="setPattern('dots')">
        Punkte
      </button>

      <button onclick="setPattern('grid')">
        Grid
      </button>

      <button onclick="setPattern('diagonal')">
        Diagonal
      </button>

    </div>

  </div>


  <!-- TEXT -->

  <div class="section">

    <div class="section-title">
      Text
    </div>

    <input
      id="textInput"
      type="text"
      placeholder="Dein Text..."
      oninput="updateText()">


    <div
      class="row"
      style="margin-top:8px">

      <button onclick="changeTextSize(-2)">
        −
      </button>

      <button onclick="changeTextSize(2)">
        +
      </button>

      <button onclick="clearText()">
        Löschen
      </button>

    </div>

  </div>


  <!-- STICKER -->

  <div class="section">

    <div class="section-title">
      Sticker
    </div>

    <div class="row">

      <button onclick="setSticker('★')">
        ★
      </button>

      <button onclick="setSticker('✦')">
        ✦
      </button>

      <button onclick="setSticker('◆')">
        ◆
      </button>

      <button onclick="setSticker('♛')">
        ♛
      </button>

      <button onclick="setSticker('✺')">
        ✺
      </button>

    </div>

  </div>


  <!-- GRÖSSE -->

  <div class="section">

    <div class="section-title">
      Größe
    </div>

    <input
      class="slider"
      id="sizeSlider"
      type="range"
      min="70"
      max="125"
      value="100"
      oninput="changeGarmentSize()">

  </div>


  <!-- SPEICHERN -->

  <div class="section">

    <button
      class="save"
      onclick="saveDesign()">

      Design speichern

    </button>

  </div>


  <!-- RESET -->

  <div class="section">

    <button
      class="danger"
      onclick="resetEverything()">

      Alles zurücksetzen

    </button>

  </div>


  <div class="small">

    Ziehe die goldenen Punkte mit
    deinem Finger. Die Form wird
    dabei weich und individuell
    angepasst.

  </div>

</aside>

</div>

</div>


<script>

/* =====================================================
   ELEMENTE
===================================================== */

const garment =
  document.getElementById("garment");

const clothingArea =
  document.getElementById("clothingArea");

const garmentDetail =
  document.getElementById("garmentDetail");

const designText =
  document.getElementById("designText");

const designSticker =
  document.getElementById("designSticker");

const points =
  Array.from(
    document.querySelectorAll(
      ".control-point"
    )
  );


/* =====================================================
   VARIABLEN
===================================================== */

let currentGarment =
  "tshirt";

let currentColor =
  "#eee6d4";

let currentPattern =
  "none";

let textSize =
  25;

let garmentScale =
  1;

let activePoint =
  null;


/* =====================================================
   T-SHIRT PUNKTE
===================================================== */

const tshirtPoints = [

  [31,6],
  [39,3],
  [50,12],
  [61,3],
  [69,6],

  [94,20],
  [100,39],
  [87,48],

  [76,34],
  [78,92],

  [65,94],
  [50,92],

  [35,94],
  [22,92],

  [24,34],
  [13,48],

  [0,39],
  [6,20]

];


/* =====================================================
   HEMD PUNKTE
===================================================== */

const shirtPoints = [

  [30,6],
  [40,3],
  [50,13],
  [60,3],
  [70,6],

  [93,19],
  [100,37],
  [88,46],

  [77,32],
  [78,93],

  [65,94],
  [50,93],

  [35,94],
  [22,93],

  [23,32],
  [12,46],

  [0,37],
  [7,19]

];


/* =====================================================
   HOSEN PUNKTE
===================================================== */

const pantsPoints = [

  [24,4],
  [38,4],
  [50,5],
  [62,4],
  [76,4],

  [81,18],
  [84,32],

  [82,45],
  [78,52],
  [75,64],
  [73,76],
  [70,100],

  [60,100],
  [52,100],

  [50,58],

  [48,100],
  [40,100],
  [30,100],

  [27,76],
  [25,64],
  [22,52],
  [18,45],

  [16,32],
  [19,18]

];


/* =====================================================
   KLEIDUNG AUSWÄHLEN
===================================================== */

function selectGarment(
  type,
  button
){

  currentGarment =
    type;

  garment.className =
    "garment " + type;


  document
    .querySelectorAll(
      ".topbar button"
    )
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );


  updateGarmentDetails();

  resetPoints();

  applyPattern();

  changeGarmentSize();

}


/* =====================================================
   DETAILS
===================================================== */

function updateGarmentDetails(){

  if(
    currentGarment ===
    "tshirt"
  ){

    garmentDetail.innerHTML =
      '<div class="collar"></div>';

  }


  else if(
    currentGarment ===
    "shirt"
  ){

    garmentDetail.innerHTML =
      '<div class="collar"></div>' +
      '<div class="button-line"></div>' +
      '<div class="pocket"></div>';

  }


  else{

    garmentDetail.innerHTML =
      '<div class="waist"></div>' +
      '<div class="leg-line"></div>';

  }

}


/* =====================================================
   FARBE
===================================================== */

function setColor(
  color
){

  currentColor =
    color;

  applyPattern();

}


/* =====================================================
   MUSTER
===================================================== */

function setPattern(
  pattern
){

  currentPattern =
    pattern;

  applyPattern();

}


function applyPattern(){

  if(
    currentPattern ===
    "none"
  ){

    garment.style.background =
      currentColor;

    garment.style.backgroundSize =
      "";

  }


  else if(
    currentPattern ===
    "stripe"
  ){

    garment.style.background =
      `repeating-linear-gradient(
        45deg,
        ${currentColor},
        ${currentColor} 16px,
        rgba(0,0,0,.17) 16px,
        rgba(0,0,0,.17) 23px
      )`;

    garment.style.backgroundSize =
      "";

  }


  else if(
    currentPattern ===
    "dots"
  ){

    garment.style.background =
      `radial-gradient(
        circle,
        rgba(0,0,0,.30) 3px,
        transparent 4px
      ),
      ${currentColor}`;

    garment.style.backgroundSize =
      "23px 23px";

  }


  else if(
    currentPattern ===
    "grid"
  ){

    garment.style.background =
      `linear-gradient(
        rgba(0,0,0,.16) 1px,
        transparent 1px
      ),
      linear-gradient(
        90deg,
        rgba(0,0,0,.16) 1px,
        transparent 1px
      ),
      ${currentColor}`;

    garment.style.backgroundSize =
      "25px 25px";

  }


  else if(
    currentPattern ===
    "diagonal"
  ){

    garment.style.background =
      `repeating-linear-gradient(
        -45deg,
        ${currentColor},
        ${currentColor} 12px,
        rgba(255,255,255,.10) 12px,
        rgba(255,255,255,.10) 18px
      )`;

  }

}


/* =====================================================
   TEXT
===================================================== */

function updateText(){

  designText.textContent =
    document
      .getElementById(
        "textInput"
      )
      .value;

}


function changeTextSize(
  amount
){

  textSize +=
    amount;


  textSize =
    Math.max(
      10,
      Math.min(
        80,
        textSize
      )
    );


  designText.style.fontSize =
    textSize + "px";

}


function clearText(){

  document
    .getElementById(
      "textInput"
    )
    .value =
    "";

  designText.textContent =
    "";

}


/* =====================================================
   STICKER
===================================================== */

function setSticker(
  sticker
){

  designSticker.textContent =
    sticker;

}


/* =====================================================
   GRÖSSE
===================================================== */

function changeGarmentSize(){

  const slider =
    document.getElementById(
      "sizeSlider"
    );


  garmentScale =
    Number(
      slider.value
    ) / 100;


  garment.style.transform =
    `scale(${garmentScale})`;

}


/* =====================================================
   PUNKT-POSITIONEN
===================================================== */

function getCurrentPoints(){

  if(
    currentGarment ===
    "tshirt"
  ){

    return tshirtPoints;

  }


  if(
    currentGarment ===
    "shirt"
  ){

    return shirtPoints;

  }


  return pantsPoints;

}


/* =====================================================
   PUNKTE ZURÜCKSETZEN
===================================================== */

function resetPoints(){

  const positions =
    getCurrentPoints();


  points.forEach(
    (point,index)=>{

      if(
        !positions[index]
      ){

        point.style.display =
          "none";

        return;

      }


      point.style.display =
        "block";


      point.style.left =
        positions[index][0] +
        "%";


      point.style.top =
        positions[index][1] +
        "%";

    }
  );


  updateShape();

}


/* =====================================================
   WEICHE VERFORMUNG
===================================================== */

/*
   Statt die Form einfach als
   scharfes Vieleck zu zeichnen,
   werden zusätzliche Zwischenpunkte
   berechnet.

   Dadurch wird die Bewegung
   deutlich weicher.
*/

function createSmoothPolygon(
  originalPoints
){

  if(
    originalPoints.length <
    3
  ){

    return "";

  }


  const smooth = [];


  for(
    let i = 0;
    i < originalPoints.length;
    i++
  ){

    const current =
      originalPoints[i];

    const next =
      originalPoints[
        (i + 1) %
        originalPoints.length
      ];


    const x1 =
      current[0];

    const y1 =
      current[1];


    const x2 =
      next[0];

    const y2 =
      next[1];


    const p1x =
      x1 +
      (x2 - x1) *
      0.25;

    const p1y =
      y1 +
      (y2 - y1) *
      0.25;


    const p2x =
      x1 +
      (x2 - x1) *
      0.75;

    const p2y =
      y1 +
      (y2 - y1) *
      0.75;


    smooth.push([
      p1x,
      p1y
    ]);


    smooth.push([
      p2x,
      p2y
    ]);

  }


  return smooth;

}


/* =====================================================
   FORM AKTUALISIEREN
===================================================== */

function updateShape(){

  const current =
    points
      .filter(
        point =>
          point.style.display !==
          "none"
      )
      .map(
        point => [

          parseFloat(
            point.style.left
          ),

          parseFloat(
            point.style.top
          )

        ]
      );


  if(
    current.length < 3
  ){

    return;

  }


  /*
     Für die visuelle Form verwenden
     wir viele Zwischenpunkte.
  */

  const smooth =
    createSmoothPolygon(
      current
    );


  const finalPoints = [];


  current.forEach(
    (point,index)=>{

      finalPoints.push(
        point
      );


      const next =
        current[
          (index + 1) %
          current.length
        ];


      /*
         Zwischenpunkte sorgen
         für weichere Übergänge.
      */

      const mid1 = [

        point[0] +
        (next[0]-point[0]) *
        0.33,

        point[1] +
        (next[1]-point[1]) *
        0.33

      ];


      const mid2 = [

        point[0] +
        (next[0]-point[0]) *
        0.66,

        point[1] +
        (next[1]-point[1]) *
        0.66

      ];


      finalPoints.push(
        mid1
      );

      finalPoints.push(
        mid2
      );

    }
  );


  garment.style.clipPath =
    "polygon(" +
    finalPoints
      .map(
        p =>
          p[0] +
          "% " +
          p[1] +
          "%"
      )
      .join(",") +
    ")";

}


/* =====================================================
   VERFORMUNG
===================================================== */

points.forEach(
  point => {

    point.addEventListener(
      "pointerdown",
      startPoint
    );


    point.addEventListener(
      "pointermove",
      movePoint
    );


    point.addEventListener(
      "pointerup",
      endPoint
    );


    point.addEventListener(
      "pointercancel",
      endPoint
    );

  }
);


/* =====================================================
   PUNKT START
===================================================== */

function startPoint(
  event
){

  event.preventDefault();


  activePoint =
    this;


  this.setPointerCapture(
    event.pointerId
  );

}


/* =====================================================
   PUNKT BEWEGEN
===================================================== */

function movePoint(
  event
){

  if(
    activePoint !==
    this
  ){

    return;

  }


  const rect =
    clothingArea
      .getBoundingClientRect();


  let x =
    (
      (event.clientX -
      rect.left)
      /
      rect.width
    ) * 100;


  let y =
    (
      (event.clientY -
      rect.top)
      /
      rect.height
    ) * 100;


  x =
    Math.max(
      0,
      Math.min(
        100,
        x
      )
    );


  y =
    Math.max(
      0,
      Math.min(
        100,
        y
      )
    );


  this.style.left =
    x + "%";


  this.style.top =
    y + "%";


  updateShape();

}


/* =====================================================
   PUNKT ENDE
===================================================== */

function endPoint(){

  activePoint =
    null;

}


/* =====================================================
   SPEICHERN
===================================================== */

function saveDesign(){

  const design = {

    garment:
      currentGarment,

    color:
      currentColor,

    pattern:
      currentPattern,

    text:
      document
        .getElementById(
          "textInput"
        )
        .value,

    sticker:
      designSticker.textContent,

    textSize:
      textSize,

    size:
      document
        .getElementById(
          "sizeSlider"
        )
        .value,

    points:
      points.map(
        point => ({

          x:
            point.style.left,

          y:
            point.style.top,

          display:
            point.style.display

        })
      )

  };


  localStorage.setItem(
    "arveDesign",
    JSON.stringify(
      design
    )
  );


  alert(
    "Arvé Design wurde gespeichert."
  );

}


/* =====================================================
   LADEN
===================================================== */

function loadDesign(){

  const saved =
    localStorage.getItem(
      "arveDesign"
    );


  if(!saved){

    return false;

  }


  try{

    const design =
      JSON.parse(
        saved
      );


    currentGarment =
      design.garment ||
      "tshirt";


    currentColor =
      design.color ||
      "#eee6d4";


    currentPattern =
      design.pattern ||
      "none";


    garment.className =
      "garment " +
      currentGarment;


    document
      .querySelectorAll(
        ".topbar button"
      )
      .forEach(
        button =>
          button.classList.remove(
            "active"
          )
      );


    if(
      currentGarment ===
      "tshirt"
    ){

      document
        .getElementById(
          "tshirtButton"
        )
        .classList.add(
          "active"
        );

    }


    else if(
      currentGarment ===
      "shirt"
    ){

      document
        .getElementById(
          "shirtButton"
        )
        .classList.add(
          "active"
        );

    }


    else{

      document
        .getElementById(
          "pantsButton"
        )
        .classList.add(
          "active"
        );

    }


    updateGarmentDetails();


    document
      .getElementById(
        "textInput"
      )
      .value =
      design.text ||
      "";


    updateText();


    designSticker.textContent =
      design.sticker ||
      "";


    textSize =
      design.textSize ||
      25;


    designText.style.fontSize =
      textSize + "px";


    if(
      design.size
    ){

      document
        .getElementById(
          "sizeSlider"
        )
        .value =
        design.size;

    }


    if(
      design.points &&
      design.points.length ===
      points.length
    ){

      design.points.forEach(
        (savedPoint,index)=>{

          points[index]
            .style.left =
            savedPoint.x;

          points[index]
            .style.top =
            savedPoint.y;

          points[index]
            .style.display =
            savedPoint.display ||
            "block";

        }
      );

    }

    else{

      resetPoints();

    }


    applyPattern();

    changeGarmentSize();

    updateShape();

    return true;

  }

  catch(error){

    console.log(
      "Arvé Speicherfehler:",
      error
    );

    return false;

  }

}


/* =====================================================
   RESET
===================================================== */

function resetEverything(){

  localStorage.removeItem(
    "arveDesign"
  );


  currentGarment =
    "tshirt";


  currentColor =
    "#eee6d4";


  currentPattern =
    "none";


  textSize =
    25;


  garmentScale =
    1;


  garment.className =
    "garment tshirt";


  garment.style.transform =
    "scale(1)";


  document
    .getElementById(
      "sizeSlider"
    )
    .value =
    "100";


  document
    .getElementById(
      "textInput"
    )
    .value =
    "";


  designText.textContent =
    "";


  designSticker.textContent =
    "";


  document
    .querySelectorAll(
      ".topbar button"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  document
    .getElementById(
      "tshirtButton"
    )
    .classList.add(
      "active"
    );


  updateGarmentDetails();

  resetPoints();

  applyPattern();

}


/* =====================================================
   START
===================================================== */

updateGarmentDetails();

resetPoints();

applyPattern();

loadDesign();

</script>
