<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arvé</title>

<style>
*{box-sizing:border-box}

:root{
  --black:#080908;
  --dark:#101411;
  --green:#17382d;
  --green-light:#244d3d;
  --wine:#641f2b;
  --cream:#eee6d4;
  --gold:#b8a16a;
  --border:rgba(184,161,106,.35);
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% 0%,#16251e,transparent 45%),
    var(--black);
  color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
}

header{
  padding:22px;
  text-align:center;
  border-bottom:1px solid #303831;
}

.logo{
  font-size:32px;
  letter-spacing:7px;
  font-weight:bold;
}

.subtitle{
  color:#aaa99f;
  margin-top:6px;
}

.app{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.controls{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  margin-bottom:20px;
}

.panel{
  background:#121814;
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
}

.panel h3{
  margin-top:0;
  font-size:15px;
  letter-spacing:1px;
}

button{
  font-family:Georgia,"Times New Roman",serif;
  background:#1d2720;
  color:var(--cream);
  border:1px solid #465148;
  border-radius:10px;
  padding:10px 14px;
  margin:4px;
  cursor:pointer;
}

button:hover{
  background:var(--green);
  border-color:var(--gold);
}

button.active{
  background:var(--wine);
  border-color:#8d4655;
}

input{
  width:100%;
  padding:11px;
  border-radius:9px;
  border:1px solid #465148;
  background:#0b0f0d;
  color:white;
  margin-bottom:8px;
}

.colors{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.color{
  width:35px;
  height:35px;
  border-radius:50%;
  border:2px solid #777;
  cursor:pointer;
}

.workspace{
  min-height:600px;
  background:
    radial-gradient(circle at center,
    rgba(36,77,61,.25),
    transparent 60%),
    #0c100e;

  border:1px solid var(--border);
  border-radius:20px;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:25px;
  overflow:hidden;
}

.clothing-area{
  position:relative;
  width:360px;
  height:460px;
}

.garment-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}

.garment-shape{
  fill:var(--cream);
  stroke:rgba(184,161,106,.75);
  stroke-width:1.5;
  filter:url(#shadow);
}

.garment-shape.pattern{
  fill:url(#pattern);
}

.detail{
  fill:none;
  stroke:rgba(35,30,24,.38);
  stroke-width:2;
  stroke-linecap:round;
  pointer-events:none;
}

.highlight{
  fill:none;
  stroke:rgba(255,255,255,.16);
  stroke-width:2;
  pointer-events:none;
}

.button-detail{
  fill:var(--gold);
  stroke:#3b3325;
  stroke-width:1;
}

.net-line{
  stroke:rgba(184,161,106,.25);
  stroke-width:1;
  pointer-events:none;
}

.deform-point{
  fill:#eee6d4;
  stroke:#17382d;
  stroke-width:3;
  cursor:grab;
  touch-action:none;
}

.deform-point:hover{
  fill:#b8a16a;
}

.deform-point.active{
  fill:#b8a16a;
  stroke:#eee6d4;
}

.element{
  position:absolute;
  cursor:grab;
  user-select:none;
  touch-action:none;
  z-index:20;
}

.element:active{
  cursor:grabbing;
}

.element.selected{
  outline:1px dashed var(--gold);
  outline-offset:7px;
}

.design-text{
  font-size:25px;
  font-weight:bold;
  color:#111;
  white-space:nowrap;
}

.sticker{
  font-size:45px;
}

.element-tools,
.deform-tools{
  display:none;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #303831;
}

.element-tools.visible,
.deform-tools.visible{
  display:block;
}

.status{
  text-align:center;
  color:#aaa99f;
  margin-top:15px;
}

@media(min-width:800px){
  .controls{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .workspace{
    min-height:520px;
    padding:10px;
  }

  .clothing-area{
    transform:scale(.9);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ARVÉ</div>
  <div class="subtitle">Design your own clothing</div>
</header>

<div class="app">

<div class="controls">

<div class="panel">
<h3>KLEIDUNG</h3>

<button onclick="setGarment('tshirt')" id="tshirtBtn" class="active">
T-Shirt
</button>

<button onclick="setGarment('shirt')" id="shirtBtn">
Hemd
</button>

<button onclick="setGarment('pants')" id="pantsBtn">
Hose
</button>
</div>


<div class="panel">
<h3>FARBE</h3>

<div class="colors">

<div class="color"
style="background:#f1eee5"
onclick="changeColor('#f1eee5')"></div>

<div class="color"
style="background:#111111"
onclick="changeColor('#111111')"></div>

<div class="color"
style="background:#173326"
onclick="changeColor('#173326')"></div>

<div class="color"
style="background:#5b1f2a"
onclick="changeColor('#5b1f2a')"></div>

<div class="color"
style="background:#777777"
onclick="changeColor('#777777')"></div>

<div class="color"
style="background:#c9b58a"
onclick="changeColor('#c9b58a')"></div>

</div>

<button onclick="togglePattern()">Muster</button>
</div>


<div class="panel">
<h3>DESIGN</h3>

<input id="textInput" placeholder="Text eingeben...">

<button onclick="addText()">
Text hinzufügen
</button>

<button onclick="addSticker('★')">★</button>
<button onclick="addSticker('✦')">✦</button>
<button onclick="addSticker('◆')">◆</button>

<br>

<button onclick="toggleDeformation()" id="deformButton">
🌀 Kleidung verformen
</button>

<div id="deformTools" class="deform-tools">

<strong>VERFORMEN</strong>

<br>

<button onclick="resetDeformation()">
Form zurücksetzen
</button>

</div>

<div id="elementTools" class="element-tools">

<strong>ELEMENT</strong>

<br>

<button onclick="changeElementSize(-.1)">−</button>
<button onclick="changeElementSize(.1)">+</button>

<button onclick="rotateElement(-15)">↺</button>
<button onclick="rotateElement(15)">↻</button>

<button onclick="deleteElement()">🗑</button>

</div>

<br>

<button onclick="saveDesign()">
Design speichern
</button>

<button onclick="resetDesign()">
Alles zurücksetzen
</button>

</div>
</div>


<div class="workspace">

<div class="clothing-area" id="clothingArea">

<svg
id="garmentSvg"
class="garment-svg"
viewBox="0 0 360 460"
>

<defs>

<filter id="shadow"
x="-30%"
y="-30%"
width="160%"
height="160%">

<feDropShadow
dx="0"
dy="6"
stdDeviation="6"
flood-color="#000"
flood-opacity=".4"
/>

</filter>

<pattern
id="pattern"
width="30"
height="30"
patternUnits="userSpaceOnUse"
patternTransform="rotate(45)"
>

<rect
width="30"
height="30"
fill="#eee6d4"
/>

<rect
width="15"
height="15"
fill="#c9b58a"
opacity=".35"
/>

</pattern>

</defs>

<path
id="garmentShape"
class="garment-shape"
d=""
></path>

<g id="garmentDetails"></g>

<g id="deformationNet"></g>

<g id="deformPoints"></g>

</svg>

</div>
</div>

<div class="status" id="status">
Drücke „Kleidung verformen“, um die Form zu bearbeiten.
</div>

</div>


<script>

const garmentSvg =
document.getElementById("garmentSvg");

const garmentShape =
document.getElementById("garmentShape");

const garmentDetails =
document.getElementById("garmentDetails");

const deformPointsGroup =
document.getElementById("deformPoints");

const deformationNet =
document.getElementById("deformationNet");

const clothingArea =
document.getElementById("clothingArea");

const statusText =
document.getElementById("status");

const deformTools =
document.getElementById("deformTools");

const deformButton =
document.getElementById("deformButton");

const elementTools =
document.getElementById("elementTools");

let garmentType="tshirt";
let garmentColor="#eee6d4";
let deformMode=false;

let selectedElement=null;

let nodes=[];
let rows=0;
let cols=0;


/* =========================================
   KLEIDUNGS-GEOMETRIE
========================================= */

const garmentData={

tshirt:{
rows:6,
cols:5,

points:[
[105,85],[140,65],[180,82],[220,65],[255,85],
[295,135],[265,175],[240,150],[240,375],[120,375],
[120,150],[95,175],[65,135]
]
},

shirt:{
rows:6,
cols:5,

points:[
[105,78],[145,55],[180,82],[215,55],[255,78],
[305,135],[275,180],[245,150],[245,400],[115,400],
[115,150],[85,180],[55,135]
]
},

pants:{
rows:7,
cols:5,

points:[
[105,65],[180,65],[255,65],
[250,130],[220,210],[218,400],
[180,400],[142,400],[140,210],
[110,130]
]
}

};


/* =========================================
   AUSSENFORM
========================================= */

function getOutline(){

  if(garmentType==="tshirt"){

    return [
      [105,85],
      [140,65],
      [180,82],
      [220,65],
      [255,85],
      [295,135],
      [265,175],
      [240,150],
      [240,375],
      [120,375],
      [120,150],
      [95,175],
      [65,135]
    ];

  }


  if(garmentType==="shirt"){

    return [
      [105,78],
      [145,55],
      [180,82],
      [215,55],
      [255,78],
      [305,135],
      [275,180],
      [245,150],
      [245,400],
      [115,400],
      [115,150],
      [85,180],
      [55,135]
    ];

  }


  return [
    [105,65],
    [180,65],
    [255,65],
    [250,130],
    [220,210],
    [218,400],
    [180,400],
    [142,400],
    [140,210],
    [110,130]
  ];
}


/* =========================================
   NETZ ERSTELLEN
========================================= */

function createDeformationMesh(){

  nodes=[];

  const outline=getOutline();

  rows =
    garmentType==="pants" ? 8 : 7;

  cols=7;

  let minX=55;
  let maxX=305;

  let minY=55;
  let maxY=400;

  for(let r=0;r<rows;r++){

    const y=
      minY+
      (maxY-minY)*
      (r/(rows-1));

    for(let c=0;c<cols;c++){

      const x=
        minX+
        (maxX-minX)*
        (c/(cols-1));

      nodes.push({

        x:x,
        y:y,

        originalX:x,
        originalY:y

      });

    }
  }

  renderEverything();
}


/* =========================================
   FORM AUS NETZ
========================================= */

function createGarmentPath(){

  const outline=getOutline();

  let d=
    `M ${outline[0][0]} ${outline[0][1]}`;

  for(let i=1;i<outline.length;i++){

    d+=
      ` L ${outline[i][0]} ${outline[i][1]}`;
  }

  d+=" Z";

  return d;
}


/* =========================================
   KLEIDUNGSDETAILS
========================================= */

function renderGarmentDetails(){

  garmentDetails.innerHTML="";


  if(garmentType==="tshirt"){

    garmentDetails.innerHTML=`

      <path
        class="detail"
        d="M140 66 Q180 105 220 66"
      />

      <path
        class="highlight"
        d="M108 91 Q180 112 252 91"
      />

      <path
        class="detail"
        d="M95 175 L120 150"
      />

      <path
        class="detail"
        d="M265 175 L240 150"
      />

      <path
        class="highlight"
        d="M128 365 L232 365"
      />

    `;

  }


  if(garmentType==="shirt"){

    garmentDetails.innerHTML=`

      <path
        class="detail"
        d="M145 55 L160 95 L180 82 L200 95 L215 55"
      />

      <path
        class="detail"
        d="M180 82 L180 400"
      />

      <path
        class="detail"
        d="M85 180 L115 150"
      />

      <path
        class="detail"
        d="M275 180 L245 150"
      />

      <circle class="button-detail"
        cx="180" cy="125" r="4"/>

      <circle class="button-detail"
        cx="180" cy="165" r="4"/>

      <circle class="button-detail"
        cx="180" cy="205" r="4"/>

      <circle class="button-detail"
        cx="180" cy="245" r="4"/>

      <circle class="button-detail"
        cx="180" cy="285" r="4"/>

      <path
        class="highlight"
        d="M125 385 L235 385"
      />

    `;

  }


  if(garmentType==="pants"){

    garmentDetails.innerHTML=`

      <path
        class="detail"
        d="M105 65 Q180 85 255 65"
      />

      <path
        class="detail"
        d="M110 92 L250 92"
      />

      <path
        class="detail"
        d="M180 92 L180 400"
      />

      <path
        class="detail"
        d="M180 115 Q155 135 140 125"
      />

      <path
        class="detail"
        d="M180 115 Q205 135 220 125"
      />

      <path
        class="highlight"
        d="M150 390 L175 390"
      />

      <path
        class="highlight"
        d="M185 390 L210 390"
      />

    `;

  }

}


/* =========================================
   VERFORMUNGSNETZ
========================================= */

function renderMesh(){

  deformationNet.innerHTML="";

  if(!deformMode)
    return;

  for(let r=0;r<rows;r++){

    for(let c=0;c<cols;c++){

      const index=
        r*cols+c;

      const node=
        nodes[index];


      if(c<cols-1){

        const right=
          nodes[index+1];

        const line=
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
          );

        line.setAttribute("x1",node.x);
        line.setAttribute("y1",node.y);
        line.setAttribute("x2",right.x);
        line.setAttribute("y2",right.y);

        line.classList.add("net-line");

        deformationNet.appendChild(line);

      }


      if(r<rows-1){

        const down=
          nodes[index+cols];

        const line=
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
          );

        line.setAttribute("x1",node.x);
        line.setAttribute("y1",node.y);
        line.setAttribute("x2",down.x);
        line.setAttribute("y2",down.y);

        line.classList.add("net-line");

        deformationNet.appendChild(line);

      }

    }

  }

}


/* =========================================
   PUNKTE
========================================= */

function renderDeformationPoints(){

  deformPointsGroup.innerHTML="";

  if(!deformMode)
    return;


  nodes.forEach((node,index)=>{

    const circle=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    circle.setAttribute("cx",node.x);
    circle.setAttribute("cy",node.y);

    circle.setAttribute("r","6");

    circle.classList.add(
      "deform-point"
    );

    circle.dataset.index=index;

    makeNodeDraggable(
      circle,
      index
    );

    deformPointsGroup.appendChild(
      circle
    );

  });

}


/* =========================================
   ALLES RENDERN
========================================= */

function renderEverything(){

  garmentShape.setAttribute(
    "d",
    createGarmentPath()
  );

  renderGarmentDetails();

  renderMesh();

  renderDeformationPoints();

}


/* =========================================
   PUNKT BEWEGEN
========================================= */

function makeNodeDraggable(circle,index){

  let dragging=false;

  circle.addEventListener(
    "pointerdown",
    event=>{

      event.stopPropagation();

      dragging=true;

      circle.classList.add("active");

      circle.setPointerCapture(
        event.pointerId
      );

    }
  );


  circle.addEventListener(
    "pointermove",
    event=>{

      if(!dragging)
        return;


      const rect=
        garmentSvg.getBoundingClientRect();


      const scaleX=
        360/rect.width;

      const scaleY=
        460/rect.height;


      let x=
        (event.clientX-rect.left)
        *scaleX;

      let y=
        (event.clientY-rect.top)
        *scaleY;


      x=Math.max(
        15,
        Math.min(345,x)
      );

      y=Math.max(
        20,
        Math.min(440,y)
      );


      nodes[index].x=x;
      nodes[index].y=y;


      garmentShape.setAttribute(
        "d",
        createGarmentPath()
      );

      renderMesh();


      circle.setAttribute(
        "cx",
        x
      );

      circle.setAttribute(
        "cy",
        y
      );


      statusText.textContent=
        "Form wird frei verändert.";

    }
  );


  circle.addEventListener(
    "pointerup",
    ()=>{
      dragging=false;
      circle.classList.remove(
        "active"
      );
    }
  );

}


/* =========================================
   VERFORMUNG AN/AUS
========================================= */

function toggleDeformation(){

  deformMode=!deformMode;

  deformTools.classList.toggle(
    "visible",
    deformMode
  );

  deformButton.classList.toggle(
    "active",
    deformMode
  );


  renderEverything();


  statusText.textContent=
    deformMode
      ?"Ziehe die vielen Punkte mit dem Finger."
      :"Verformung beendet.";

}


/* =========================================
   FORM ZURÜCKSETZEN
========================================= */

function resetDeformation(){

  nodes.forEach(node=>{

    node.x=
      node.originalX;

    node.y=
      node.originalY;

  });


  renderEverything();


  statusText.textContent=
    "Form zurückgesetzt.";

}


/* =========================================
   KLEIDUNG WECHSELN
========================================= */

function setGarment(type){

  garmentType=type;

  document
    .querySelectorAll(
      ".panel:first-child button"
    )
    .forEach(button=>
      button.classList.remove("active")
    );


  document
    .getElementById(
      type+"Btn"
    )
    .classList.add("active");


  createDeformationMesh();


  statusText.textContent=
    "Kleidungsstück geändert.";

}


/* =========================================
   FARBE
========================================= */

function changeColor(color){

  garmentColor=color;

  garmentShape.classList.remove(
    "pattern"
  );

  garmentShape.style.fill=color;

  statusText.textContent=
    "Farbe geändert.";

}


/* =========================================
   MUSTER
========================================= */

function togglePattern(){

  garmentShape.classList.toggle(
    "pattern"
  );


  statusText.textContent=
    garmentShape.classList.contains("pattern")
      ?"Muster aktiviert."
      :"Muster deaktiviert.";

}


/* =========================================
   TEXT
========================================= */

function addText(){

  const input=
    document.getElementById(
      "textInput"
    );

  const text=
    input.value.trim();

  if(!text)
    return;


  const element=
    document.createElement("div");


  element.className=
    "element design-text";

  element.textContent=text;

  element.style.left="130px";
  element.style.top="190px";

  element.dataset.scale="1";
  element.dataset.rotation="0";


  clothingArea.appendChild(
    element
  );

  makeDraggable(
    element
  );

  selectElement(
    element
  );


  input.value="";

  statusText.textContent=
    "Text hinzugefügt.";

}


/* =========================================
   STICKER
========================================= */

function addSticker(symbol){

  const element=
    document.createElement("div");


  element.className=
    "element sticker";

  element.textContent=
    symbol;

  element.style.left=
    "145px";

  element.style.top=
    "230px";

  element.dataset.scale=
    "1";

  element.dataset.rotation=
    "0";


  clothingArea.appendChild(
    element
  );

  makeDraggable(
    element
  );

  selectElement(
    element
  );


  statusText.textContent=
    "Sticker hinzugefügt.";

}


/* =========================================
   ELEMENT AUSWÄHLEN
========================================= */

function selectElement(element){

  if(selectedElement){

    selectedElement.classList
      .remove("selected");

  }


  selectedElement=element;

  selectedElement.classList
    .add("selected");

  elementTools.classList
    .add("visible");

}


/* =========================================
   ELEMENT VERSCHIEBEN
========================================= */

function makeDraggable(element){

  let dragging=false;

  let startX=0;
  let startY=0;

  let startLeft=0;
  let startTop=0;


  element.addEventListener(
    "pointerdown",
    event=>{

      event.stopPropagation();

      selectElement(element);

      dragging=true;

      startX=event.clientX;
      startY=event.clientY;

      startLeft=element.offsetLeft;
      startTop=element.offsetTop;

      element.setPointerCapture(
        event.pointerId
      );

    }
  );


  element.addEventListener(
    "pointermove",
    event=>{

      if(!dragging)
        return;


      element.style.left=
        startLeft+
        event.clientX-
        startX+
        "px";


      element.style.top=
        startTop+
        event.clientY-
        startY+
        "px";

    }
  );


  element.addEventListener(
    "pointerup",
    ()=>{
      dragging=false;
    }
  );

}


/* =========================================
   ELEMENT GRÖSSE
========================================= */

function changeElementSize(amount){

  if(!selectedElement)
    return;


  let scale=
    parseFloat(
      selectedElement.dataset.scale
    );


  scale+=amount;

  scale=Math.max(
    .5,
    Math.min(3,scale)
  );


  selectedElement.dataset.scale=
    scale;


  updateElementTransform(
    selectedElement
  );

}


/* =========================================
   DREHEN
========================================= */

function rotateElement(amount){

  if(!selectedElement)
    return;


  let rotation=
    parseFloat(
      selectedElement.dataset.rotation
    );


  rotation+=amount;

  selectedElement.dataset.rotation=
    rotation;


  updateElementTransform(
    selectedElement
  );

}


/* =========================================
   TRANSFORM
========================================= */

function updateElementTransform(element){

  element.style.transform=
    `scale(${element.dataset.scale})
     rotate(${element.dataset.rotation}deg)`;

}


/* =========================================
   LÖSCHEN
========================================= */

function deleteElement(){

  if(!selectedElement)
    return;


  selectedElement.remove();

  selectedElement=null;

  elementTools.classList
    .remove("visible");


  statusText.textContent=
    "Element gelöscht.";

}


/* =========================================
   SPEICHERN
========================================= */

function saveDesign(){

  const design={

    garmentType:
      garmentType,

    garmentColor:
      garmentColor,

    nodes:
      nodes,

    elements:[]

  };


  document
    .querySelectorAll(".element")
    .forEach(element=>{

      design.elements.push({

        text:
          element.textContent,

        className:
          element.className,

        left:
          element.style.left,

        top:
          element.style.top,

        scale:
          element.dataset.scale,

        rotation:
          element.dataset.rotation

      });

    });


  localStorage.setItem(
    "arveDesign",
    JSON.stringify(design)
  );


  statusText.textContent=
    "✓ Arvé-Design gespeichert.";

}


/* =========================================
   RESET
========================================= */

function resetDesign(){

  garmentType="tshirt";

  garmentColor="#eee6d4";

  garmentShape.style.fill=
    garmentColor;

  garmentShape.classList
    .remove("pattern");


  document
    .querySelectorAll(".element")
    .forEach(element=>
      element.remove()
    );


  selectedElement=null;

  elementTools.classList
    .remove("visible");


  deformMode=false;

  deformTools.classList
    .remove("visible");

  deformButton.classList
    .remove("active");


  document
    .querySelectorAll(
      ".panel:first-child button"
    )
    .forEach(button=>
      button.classList.remove("active")
    );


  document
    .getElementById("tshirtBtn")
    .classList.add("active");


  createDeformationMesh();


  statusText.textContent=
    "Arvé-Design zurückgesetzt.";

}


/* =========================================
   START
========================================= */

createDeformationMesh();

</script>
