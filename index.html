<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arvé</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --black:#080908;
  --dark:#101411;
  --green:#17382d;
  --green-light:#244d3d;
  --wine:#641f2b;
  --cream:#eee6d4;
  --gold:#b8a16a;
  --border:rgba(184,161,106,.35);
}

body {
  margin:0;
  background:
    radial-gradient(circle at 50% 0%,#16251e,transparent 45%),
    var(--black);
  color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
}

header {
  padding:22px;
  text-align:center;
  border-bottom:1px solid #303831;
}

.logo {
  font-size:32px;
  letter-spacing:7px;
  font-weight:bold;
}

.subtitle {
  color:#aaa99f;
  margin-top:6px;
}

.app {
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.controls {
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  margin-bottom:20px;
}

.panel {
  background:#121814;
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
}

.panel h3 {
  margin-top:0;
  font-size:15px;
  letter-spacing:1px;
}

button {
  font-family:Georgia,"Times New Roman",serif;
  background:#1d2720;
  color:var(--cream);
  border:1px solid #465148;
  border-radius:10px;
  padding:10px 14px;
  margin:4px;
  cursor:pointer;
  transition:.2s;
}

button:hover {
  background:var(--green);
  border-color:var(--gold);
}

button.active {
  background:var(--wine);
  border-color:#8d4655;
}

input {
  width:100%;
  padding:11px;
  border-radius:9px;
  border:1px solid #465148;
  background:#0b0f0d;
  color:white;
  margin-bottom:8px;
}

.colors {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.color {
  width:35px;
  height:35px;
  border-radius:50%;
  border:2px solid #777;
  cursor:pointer;
}

.workspace {
  min-height:600px;
  background:
    radial-gradient(circle at center,
      rgba(36,77,61,.25),
      transparent 60%),
    #0c100e;

  border:1px solid var(--border);
  border-radius:20px;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:25px;
  overflow:hidden;
}

.clothing-area {
  position:relative;
  width:360px;
  height:460px;
}

.garment-svg {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}

.garment-shape {
  fill:#eee6d4;
  stroke:rgba(184,161,106,.75);
  stroke-width:1.5;
  stroke-linejoin:round;
  filter:url(#clothShadow);
  transition:fill .25s;
}

.garment-shape.pattern {
  fill:url(#pattern);
}

.detail {
  pointer-events:none;
  fill:none;
  stroke:rgba(40,35,28,.28);
  stroke-width:2;
  stroke-linecap:round;
}

.detail-light {
  pointer-events:none;
  fill:none;
  stroke:rgba(255,255,255,.18);
  stroke-width:1.5;
}

.collar {
  pointer-events:none;
  fill:none;
  stroke:rgba(40,35,28,.38);
  stroke-width:2;
}

.button-detail {
  pointer-events:none;
  fill:#b8a16a;
  stroke:#3b3325;
  stroke-width:1;
}

.deform-point {
  fill:#eee6d4;
  stroke:#17382d;
  stroke-width:3;
  cursor:grab;
  touch-action:none;
}

.deform-point:hover {
  fill:#b8a16a;
}

.deform-point.active {
  fill:#b8a16a;
  stroke:#eee6d4;
}

.element {
  position:absolute;
  cursor:grab;
  user-select:none;
  touch-action:none;
  z-index:20;
}

.element:active {
  cursor:grabbing;
}

.element.selected {
  outline:1px dashed var(--gold);
  outline-offset:7px;
}

.design-text {
  font-size:25px;
  font-weight:bold;
  color:#111;
  white-space:nowrap;
}

.sticker {
  font-size:45px;
}

.element-tools,
.deform-tools {
  display:none;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #303831;
}

.element-tools.visible,
.deform-tools.visible {
  display:block;
}

.status {
  text-align:center;
  color:#aaa99f;
  margin-top:15px;
}

@media(min-width:800px) {
  .controls {
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px) {

  .workspace {
    min-height:520px;
    padding:10px;
  }

  .clothing-area {
    transform:scale(.9);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ARVÉ</div>
  <div class="subtitle">Design your own clothing</div>
</header>

<div class="app">

<div class="controls">

<div class="panel">

<h3>KLEIDUNG</h3>

<button onclick="setGarment('tshirt')" id="tshirtBtn" class="active">
T-Shirt
</button>

<button onclick="setGarment('shirt')" id="shirtBtn">
Hemd
</button>

<button onclick="setGarment('pants')" id="pantsBtn">
Hose
</button>

</div>


<div class="panel">

<h3>FARBE</h3>

<div class="colors">

<div class="color"
style="background:#f1eee5"
onclick="changeColor('#f1eee5')"></div>

<div class="color"
style="background:#111111"
onclick="changeColor('#111111')"></div>

<div class="color"
style="background:#173326"
onclick="changeColor('#173326')"></div>

<div class="color"
style="background:#5b1f2a"
onclick="changeColor('#5b1f2a')"></div>

<div class="color"
style="background:#777777"
onclick="changeColor('#777777')"></div>

<div class="color"
style="background:#c9b58a"
onclick="changeColor('#c9b58a')"></div>

</div>

<button onclick="togglePattern()">
Muster
</button>

</div>


<div class="panel">

<h3>DESIGN</h3>

<input
id="textInput"
placeholder="Text eingeben..."
>

<button onclick="addText()">
Text hinzufügen
</button>

<button onclick="addSticker('★')">★</button>
<button onclick="addSticker('✦')">✦</button>
<button onclick="addSticker('◆')">◆</button>

<br>

<button onclick="toggleDeformation()" id="deformButton">
🌀 Kleidung verformen
</button>

<div id="deformTools" class="deform-tools">

<strong>VERFORMEN</strong>

<br>

<button onclick="resetDeformation()">
Form zurücksetzen
</button>

</div>

<div id="elementTools" class="element-tools">

<strong>ELEMENT</strong>

<br>

<button onclick="changeElementSize(-.1)">−</button>
<button onclick="changeElementSize(.1)">+</button>

<button onclick="rotateElement(-15)">↺</button>
<button onclick="rotateElement(15)">↻</button>

<button onclick="deleteElement()">🗑</button>

</div>

<br>

<button onclick="saveDesign()">
Design speichern
</button>

<button onclick="resetDesign()">
Alles zurücksetzen
</button>

</div>

</div>


<div class="workspace">

<div class="clothing-area" id="clothingArea">

<svg
id="garmentSvg"
class="garment-svg"
viewBox="0 0 360 460"
>

<defs>

<filter id="clothShadow"
x="-30%"
y="-30%"
width="160%"
height="160%">

<feDropShadow
dx="0"
dy="5"
stdDeviation="5"
flood-color="#000000"
flood-opacity=".35"
/>

</filter>


<pattern
id="pattern"
width="30"
height="30"
patternUnits="userSpaceOnUse"
patternTransform="rotate(45)"
>

<rect
width="30"
height="30"
fill="#eee6d4"
/>

<rect
width="15"
height="15"
fill="#c9b58a"
opacity=".35"
/>

</pattern>

</defs>


<!-- KLEIDUNGSFORM -->

<path
id="garmentShape"
class="garment-shape"
d=""
/>


<!-- DETAILS -->

<g id="garmentDetails"></g>


<!-- VERFORMUNG -->

<g id="deformPoints"></g>

</svg>

</div>

</div>

<div class="status" id="status">
Drücke „Kleidung verformen“, um die Form zu bearbeiten.
</div>

</div>


<script>

const clothingArea =
document.getElementById("clothingArea");

const garmentSvg =
document.getElementById("garmentSvg");

const garmentShape =
document.getElementById("garmentShape");

const garmentDetails =
document.getElementById("garmentDetails");

const deformPointsGroup =
document.getElementById("deformPoints");

const statusText =
document.getElementById("status");

const deformTools =
document.getElementById("deformTools");

const deformButton =
document.getElementById("deformButton");

const elementTools =
document.getElementById("elementTools");

let selectedElement = null;

let deformMode = false;

let garmentType = "tshirt";

let garmentColor = "#eee6d4";

let points = [];


/* =================================
   GRUNDFORM
================================= */

function getGarmentPoints(type) {

  if(type === "pants") {

    return [

      [105,65],
      [175,65],
      [180,205],
      [175,400],
      [135,400],
      [128,250],
      [120,400],
      [80,400],
      [75,205]

    ];
  }


  if(type === "shirt") {

    return [

      [112,70],
      [145,52],
      [180,82],
      [215,52],
      [248,70],

      [305,135],
      [274,178],
      [245,150],

      [245,400],
      [115,400],

      [115,150],
      [86,178],
      [55,135]

    ];
  }


  return [

    [120,74],
    [150,57],
    [180,82],
    [210,57],
    [240,74],

    [298,136],
    [270,176],
    [242,150],

    [242,378],
    [118,378],

    [118,150],
    [90,176],
    [62,136]

  ];
}


/* =================================
   FORM ALS SVG PFAD
================================= */

function createGarmentPath() {

  const p = points;

  if(!p.length) return "";

  let d =
    `M ${p[0].x} ${p[0].y}`;

  for(let i=1;i<p.length;i++) {

    d +=
      ` L ${p[i].x} ${p[i].y}`;
  }

  d += " Z";

  return d;
}


/* =================================
   DETAILS
================================= */

function renderGarmentDetails() {

  garmentDetails.innerHTML = "";

  if(garmentType === "tshirt") {

    garmentDetails.innerHTML = `

      <path
        class="collar"
        d="M150 58 Q180 96 210 58"
      />

      <path
        class="detail"
        d="M120 74 L90 136"
      />

      <path
        class="detail"
        d="M240 74 L270 136"
      />

      <path
        class="detail-light"
        d="M130 365 L230 365"
      />

    `;
  }


  if(garmentType === "shirt") {

    garmentDetails.innerHTML = `

      <path
        class="collar"
        d="M145 52 L160 92 L180 82 L200 92 L215 52"
      />

      <path
        class="detail"
        d="M180 82 L180 400"
      />

      <path
        class="detail"
        d="M115 150 L86 178"
      />

      <path
        class="detail"
        d="M245 150 L274 178"
      />

      <circle
        class="button-detail"
        cx="180"
        cy="125"
        r="4"
      />

      <circle
        class="button-detail"
        cx="180"
        cy="165"
        r="4"
      />

      <circle
        class="button-detail"
        cx="180"
        cy="205"
        r="4"
      />

      <circle
        class="button-detail"
        cx="180"
        cy="245"
        r="4"
      />

      <circle
        class="button-detail"
        cx="180"
        cy="285"
        r="4"
      />

    `;
  }


  if(garmentType === "pants") {

    garmentDetails.innerHTML = `

      <path
        class="detail"
        d="M105 65 Q140 80 175 65"
      />

      <path
        class="detail"
        d="M175 65 Q180 85 180 110"
      />

      <path
        class="detail"
        d="M105 88 L175 88"
      />

      <path
        class="detail"
        d="M175 110 Q150 130 128 110"
      />

      <path
        class="detail"
        d="M128 110 L120 400"
      />

      <path
        class="detail"
        d="M180 110 L175 400"
      />

      <path
        class="detail-light"
        d="M85 385 L120 385"
      />

      <path
        class="detail-light"
        d="M140 385 L175 385"
      />

    `;
  }
}


/* =================================
   PUNKTE
================================= */

function createDeformationGrid() {

  deformPointsGroup.innerHTML = "";

  const base =
    getGarmentPoints(garmentType);

  points =
    base.map(p => ({

      x:p[0],
      y:p[1],

      originalX:p[0],
      originalY:p[1]

    }));

  renderDeformation();

}


/* =================================
   RENDERN
================================= */

function renderDeformation() {

  garmentShape.setAttribute(
    "d",
    createGarmentPath()
  );

  renderGarmentDetails();

  deformPointsGroup.innerHTML = "";

  if(!deformMode)
    return;


  points.forEach((point,index) => {

    const circle =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    circle.setAttribute(
      "cx",
      point.x
    );

    circle.setAttribute(
      "cy",
      point.y
    );

    circle.setAttribute(
      "r",
      "7"
    );

    circle.classList.add(
      "deform-point"
    );

    circle.dataset.index =
      index;

    makePointDraggable(
      circle,
      index
    );

    deformPointsGroup.appendChild(
      circle
    );

  });

}


/* =================================
   PUNKT BEWEGEN
================================= */

function makePointDraggable(
  circle,
  index
) {

  let dragging = false;


  circle.addEventListener(
    "pointerdown",
    event => {

      event.stopPropagation();

      dragging = true;

      circle.classList.add(
        "active"
      );

      circle.setPointerCapture(
        event.pointerId
      );

    }
  );


  circle.addEventListener(
    "pointermove",
    event => {

      if(!dragging)
        return;

      const rect =
        garmentSvg.getBoundingClientRect();

      const scaleX =
        360 / rect.width;

      const scaleY =
        460 / rect.height;


      let x =
        (event.clientX - rect.left)
        * scaleX;

      let y =
        (event.clientY - rect.top)
        * scaleY;


      x =
        Math.max(
          10,
          Math.min(350,x)
        );

      y =
        Math.max(
          10,
          Math.min(450,y)
        );


      points[index].x = x;
      points[index].y = y;

      renderDeformation();

      statusText.textContent =
        "Kleidungsform wird verändert.";

    }
  );


  circle.addEventListener(
    "pointerup",
    () => {

      dragging = false;

      circle.classList.remove(
        "active"
      );

    }
  );

}


/* =================================
   VERFORMUNG
================================= */

function toggleDeformation() {

  deformMode =
    !deformMode;

  deformTools.classList.toggle(
    "visible",
    deformMode
  );

  deformButton.classList.toggle(
    "active",
    deformMode
  );

  renderDeformation();


  statusText.textContent =
    deformMode
      ? "Ziehe die Punkte mit dem Finger."
      : "Verformung beendet.";

}


/* =================================
   RESET FORM
================================= */

function resetDeformation() {

  points.forEach(point => {

    point.x =
      point.originalX;

    point.y =
      point.originalY;

  });

  renderDeformation();

  statusText.textContent =
    "Kleidungsform zurückgesetzt.";

}


/* =================================
   KLEIDUNG WECHSELN
================================= */

function setGarment(type) {

  garmentType =
    type;


  document
    .querySelectorAll(
      ".panel:first-child button"
    )
    .forEach(button =>
      button.classList.remove(
        "active"
      )
    );


  document
    .getElementById(
      type + "Btn"
    )
    .classList.add(
      "active"
    );


  createDeformationGrid();


  statusText.textContent =
    "Kleidungsstück geändert.";

}


/* =================================
   FARBE
================================= */

function changeColor(color) {

  garmentColor =
    color;

  garmentShape.classList.remove(
    "pattern"
  );

  garmentShape.style.fill =
    color;

  statusText.textContent =
    "Farbe geändert.";

}


/* =================================
   MUSTER
================================= */

function togglePattern() {

  garmentShape.classList.toggle(
    "pattern"
  );


  if(
    garmentShape.classList.contains(
      "pattern"
    )
  ) {

    statusText.textContent =
      "Muster aktiviert.";

  } else {

    garmentShape.style.fill =
      garmentColor;

    statusText.textContent =
      "Muster deaktiviert.";

  }

}


/* =================================
   TEXT
================================= */

function addText() {

  const input =
    document.getElementById(
      "textInput"
    );

  const text =
    input.value.trim();

  if(!text)
    return;


  const element =
    document.createElement(
      "div"
    );


  element.className =
    "element design-text";

  element.textContent =
    text;

  element.style.left =
    "130px";

  element.style.top =
    "190px";

  element.dataset.scale =
    "1";

  element.dataset.rotation =
    "0";


  clothingArea.appendChild(
    element
  );


  makeDraggable(
    element
  );

  selectElement(
    element
  );


  input.value = "";

  statusText.textContent =
    "Text hinzugefügt.";

}


/* =================================
   STICKER
================================= */

function addSticker(symbol) {

  const element =
    document.createElement(
      "div"
    );

  element.className =
    "element sticker";

  element.textContent =
    symbol;

  element.style.left =
    "145px";

  element.style.top =
    "230px";

  element.dataset.scale =
    "1";

  element.dataset.rotation =
    "0";


  clothingArea.appendChild(
    element
  );


  makeDraggable(
    element
  );

  selectElement(
    element
  );


  statusText.textContent =
    "Sticker hinzugefügt.";

}


/* =================================
   ELEMENT AUSWÄHLEN
================================= */

function selectElement(element) {

  if(selectedElement) {

    selectedElement.classList
      .remove("selected");

  }


  selectedElement =
    element;


  selectedElement.classList
    .add("selected");


  elementTools.classList
    .add("visible");

}


/* =================================
   ELEMENT VERSCHIEBEN
================================= */

function makeDraggable(element) {

  let dragging = false;

  let startX = 0;
  let startY = 0;

  let startLeft = 0;
  let startTop = 0;


  element.addEventListener(
    "pointerdown",
    event => {

      event.stopPropagation();

      selectElement(
        element
      );

      dragging = true;

      startX =
        event.clientX;

      startY =
        event.clientY;

      startLeft =
        element.offsetLeft;

      startTop =
        element.offsetTop;


      element.setPointerCapture(
        event.pointerId
      );

    }
  );


  element.addEventListener(
    "pointermove",
    event => {

      if(!dragging)
        return;


      element.style.left =
        startLeft +
        event.clientX -
        startX +
        "px";


      element.style.top =
        startTop +
        event.clientY -
        startY +
        "px";

    }
  );


  element.addEventListener(
    "pointerup",
    () => {

      dragging = false;

    }
  );

}


/* =================================
   ELEMENT GRÖSSE
================================= */

function changeElementSize(amount) {

  if(!selectedElement)
    return;


  let scale =
    parseFloat(
      selectedElement.dataset.scale
    );


  scale += amount;


  scale =
    Math.max(
      .5,
      Math.min(3,scale)
    );


  selectedElement.dataset.scale =
    scale;


  updateElementTransform(
    selectedElement
  );

}


/* =================================
   ELEMENT DREHEN
================================= */

function rotateElement(amount) {

  if(!selectedElement)
    return;


  let rotation =
    parseFloat(
      selectedElement.dataset.rotation
    );


  rotation += amount;


  selectedElement.dataset.rotation =
    rotation;


  updateElementTransform(
    selectedElement
  );

}


/* =================================
   TRANSFORM
================================= */

function updateElementTransform(element) {

  element.style.transform =
    `scale(${element.dataset.scale})
     rotate(${element.dataset.rotation}deg)`;

}


/* =================================
   ELEMENT LÖSCHEN
================================= */

function deleteElement() {

  if(!selectedElement)
    return;


  selectedElement.remove();

  selectedElement =
    null;


  elementTools.classList
    .remove("visible");


  statusText.textContent =
    "Element gelöscht.";

}


/* =================================
   SPEICHERN
================================= */

function saveDesign() {

  const design = {

    garmentType:
      garmentType,

    garmentColor:
      garmentColor,

    deformation:
      points,

    elements:[]

  };


  document
    .querySelectorAll(
      ".element"
    )
    .forEach(element => {

      design.elements.push({

        text:
          element.textContent,

        className:
          element.className,

        left:
          element.style.left,

        top:
          element.style.top,

        scale:
          element.dataset.scale,

        rotation:
          element.dataset.rotation

      });

    });


  localStorage.setItem(
    "arveDesign",
    JSON.stringify(
      design
    )
  );


  statusText.textContent =
    "✓ Arvé-Design gespeichert.";

}


/* =================================
   RESET
================================= */

function resetDesign() {

  garmentType =
    "tshirt";

  garmentColor =
    "#eee6d4";


  garmentShape.style.fill =
    garmentColor;


  garmentShape.classList
    .remove("pattern");


  document
    .querySelectorAll(
      ".element"
    )
    .forEach(element =>
      element.remove()
    );


  selectedElement =
    null;


  elementTools.classList
    .remove("visible");


  deformMode =
    false;


  deformTools.classList
    .remove("visible");


  deformButton.classList
    .remove("active");


  document
    .querySelectorAll(
      ".panel:first-child button"
    )
    .forEach(button =>
      button.classList.remove(
        "active"
      )
    );


  document
    .getElementById(
      "tshirtBtn"
    )
    .classList.add(
      "active"
    );


  createDeformationGrid();


  statusText.textContent =
    "Arvé-Design zurückgesetzt.";

}


/* =================================
   START
================================= */

createDeformationGrid();

</script>

</body>
</html>
