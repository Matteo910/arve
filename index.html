<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Arvé</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --black:#080908;
  --dark:#101411;
  --green:#17382d;
  --green-light:#244d3d;
  --wine:#641f2b;
  --cream:#eee6d4;
  --gold:#b8a16a;
  --border:rgba(184,161,106,.35);
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 0%,#1b3027 0%,transparent 43%),
    var(--black);
  color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
  touch-action:pan-y;
}

button,
input{
  font:inherit;
}

header{
  padding:22px 18px 16px;
  text-align:center;
  border-bottom:1px solid var(--border);
  background:rgba(8,9,8,.90);
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:31px;
  letter-spacing:7px;
  font-weight:bold;
}

.subtitle{
  margin-top:5px;
  font-size:11px;
  letter-spacing:3px;
  color:var(--gold);
  text-transform:uppercase;
}

.app{
  width:min(1100px,100%);
  margin:auto;
  padding:18px;
}

.toolbar,
.style-bar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.toolbar::-webkit-scrollbar,
.style-bar::-webkit-scrollbar{
  display:none;
}

.tool-btn,
.style-btn,
.option,
.action{
  cursor:pointer;
  color:var(--cream);
  transition:.18s ease;
}

.tool-btn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--dark);
  padding:11px 16px;
  border-radius:9px;
}

.tool-btn.active,
.tool-btn:hover{
  background:var(--green);
  border-color:var(--gold);
}

.style-bar{
  margin:10px 0 14px;
  padding:2px 0 7px;
}

.style-btn{
  flex:0 0 auto;
  border:1px solid rgba(184,161,106,.22);
  background:#0c100d;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
}

.style-btn.active,
.style-btn:hover{
  background:var(--wine);
  border-color:var(--gold);
}

.editor{
  display:grid;
  grid-template-columns:1fr 300px;
  gap:18px;
}

@media(max-width:800px){
  .editor{
    grid-template-columns:1fr;
  }
}

.canvas-card,
.panel{
  background:rgba(16,20,17,.92);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}

.canvas-card{
  min-height:650px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  overflow:hidden;
}

.canvas{
  width:min(100%,500px);
  aspect-ratio:4/5;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.garment-wrap{
  width:90%;
  height:94%;
  position:relative;
  transform-origin:center;
  touch-action:none;
}

#garmentSvg{
  width:100%;
  height:100%;
  overflow:visible;
  touch-action:none;
  user-select:none;
}

#garmentPath{
  stroke:#111;
  stroke-width:2.2;
  vector-effect:non-scaling-stroke;
}

.fabric-light{
  fill:url(#fabricGradient);
  pointer-events:none;
  opacity:.75;
}

.fabric-shadow{
  fill:none;
  stroke:rgba(0,0,0,.16);
  stroke-width:7;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.seam{
  fill:none;
  stroke:rgba(15,15,15,.38);
  stroke-width:1.5;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.stitch{
  fill:none;
  stroke:rgba(20,20,20,.40);
  stroke-width:1.1;
  stroke-dasharray:3 3;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.fold{
  fill:none;
  stroke:rgba(20,20,20,.18);
  stroke-width:2;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.fold-light{
  fill:none;
  stroke:rgba(255,255,255,.12);
  stroke-width:2;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.collar{
  fill:rgba(255,255,255,.05);
  stroke:rgba(20,20,20,.43);
  stroke-width:1.6;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.pocket{
  fill:rgba(255,255,255,.025);
  stroke:rgba(20,20,20,.42);
  stroke-width:1.6;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.button-detail{
  fill:#171717;
  stroke:rgba(255,255,255,.25);
  stroke-width:1;
  pointer-events:none;
}

.mesh-point{
  fill:var(--gold);
  stroke:#080908;
  stroke-width:1.2;
  opacity:0;
  pointer-events:none;
}

.show-mesh .mesh-point{
  opacity:.72;
}

.mesh-line{
  fill:none;
  stroke:rgba(184,161,106,.25);
  stroke-width:.8;
  opacity:0;
  pointer-events:none;
}

.show-mesh .mesh-line{
  opacity:1;
}

#patternGroup{
  pointer-events:none;
  opacity:.20;
  mix-blend-mode:multiply;
}

.pattern-dot{
  fill:#111;
}

.pattern-line{
  stroke:#111;
  stroke-width:2;
}

.pattern-grid{
  stroke:#111;
  stroke-width:1.2;
}

#designText{
  position:absolute;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  color:#111;
  font-size:26px;
  font-weight:bold;
  pointer-events:none;
  text-align:center;
  white-space:nowrap;
  z-index:10;
}

#sticker{
  position:absolute;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  font-size:42px;
  pointer-events:none;
  z-index:11;
}

.hint{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(238,230,212,.55);
  font-size:11px;
  white-space:nowrap;
}

.panel{
  padding:17px;
}

.panel h2{
  margin:0 0 15px;
  font-size:18px;
  color:var(--gold);
}

.section{
  margin-bottom:20px;
}

.section-title{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#a99e87;
  margin-bottom:9px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.option{
  border:1px solid var(--border);
  background:#0c100d;
  padding:9px 11px;
  border-radius:8px;
}

.option.active,
.option:hover{
  background:var(--green);
  border-color:var(--gold);
}

input[type="color"]{
  width:48px;
  height:38px;
  padding:3px;
  border:1px solid var(--border);
  background:var(--dark);
  border-radius:8px;
}

input[type="range"]{
  width:100%;
  accent-color:var(--gold);
}

.text-input{
  width:100%;
  background:#0b0e0c;
  color:var(--cream);
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px;
  outline:none;
}

.action-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.action{
  flex:1;
  min-width:100px;
  padding:11px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--green);
}

.action.secondary{
  background:#0c100d;
}

.touching #garmentSvg{
  cursor:grabbing;
}
</style>
</head>

<body>

<header>
  <div class="logo">ARVÉ</div>
  <div class="subtitle">Create Your Own</div>
</header>

<div class="app">

  <div class="toolbar">

    <button class="tool-btn active"
            id="shirtButton"
            onclick="selectGarment('shirt',this)">
      T-Shirt
    </button>

    <button class="tool-btn"
            id="formalButton"
            onclick="selectGarment('formal',this)">
      Hemd
    </button>

    <button class="tool-btn"
            id="pantsButton"
            onclick="selectGarment('pants',this)">
      Hose
    </button>

  </div>

  <div class="style-bar" id="styleBar"></div>

  <div class="editor">

    <div class="canvas-card">

      <div class="canvas">

        <div class="garment-wrap" id="garmentWrap">

          <svg id="garmentSvg"
               viewBox="0 0 400 540"
               preserveAspectRatio="xMidYMid meet">

            <defs>

              <linearGradient id="fabricGradient"
                              x1="0"
                              y1="0"
                              x2="1"
                              y2="1">

                <stop offset="0%"
                      stop-color="#ffffff"
                      stop-opacity=".20"/>

                <stop offset="42%"
                      stop-color="#ffffff"
                      stop-opacity="0"/>

                <stop offset="100%"
                      stop-color="#000000"
                      stop-opacity=".20"/>

              </linearGradient>

              <clipPath id="garmentClip">
                <path id="clipShape"></path>
              </clipPath>

            </defs>

            <path id="garmentPath"></path>

            <path id="fabricLight"
                  class="fabric-light"></path>

            <g id="patternGroup"
               clip-path="url(#garmentClip)">
            </g>

            <g id="detailsGroup"></g>

            <g id="foldGroup"></g>

            <g id="meshLines"></g>

            <g id="meshPoints"></g>

          </svg>

        </div>

        <div id="designText"></div>
        <div id="sticker"></div>

      </div>

      <div class="hint">
        Finger auf den Stoff legen und ziehen
      </div>

    </div>


    <div class="panel">

      <h2>Arvé Studio</h2>


      <div class="section">

        <div class="section-title">
          Kleidungsstück
        </div>

        <div class="options">

          <button class="option"
                  onclick="selectGarment('shirt',
                  document.getElementById('shirtButton'))">
            T-Shirt
          </button>

          <button class="option"
                  onclick="selectGarment('formal',
                  document.getElementById('formalButton'))">
            Hemd
          </button>

          <button class="option"
                  onclick="selectGarment('pants',
                  document.getElementById('pantsButton'))">
            Hose
          </button>

        </div>

      </div>


      <div class="section">

        <div class="section-title">
          Farbe
        </div>

        <div class="options">

          <button class="option"
                  onclick="setColor('#eee6d4')">
            Cream
          </button>

          <button class="option"
                  onclick="setColor('#111311')">
            Black
          </button>

          <button class="option"
                  onclick="setColor('#17382d')">
            Green
          </button>

          <button class="option"
                  onclick="setColor('#641f2b')">
            Wine
          </button>

          <input type="color"
                 id="colorPicker"
                 value="#eee6d4"
                 onchange="setColor(this.value)">

        </div>

      </div>


      <div class="section">

        <div class="section-title">
          Muster
        </div>

        <div class="options">

          <button class="option"
                  onclick="setPattern('none')">
            Clean
          </button>

          <button class="option"
                  onclick="setPattern('dots')">
            Dots
          </button>

          <button class="option"
                  onclick="setPattern('lines')">
            Lines
          </button>

          <button class="option"
                  onclick="setPattern('grid')">
            Grid
          </button>

        </div>

      </div>


      <div class="section">

        <div class="section-title">
          Text
        </div>

        <input class="text-input"
               id="textInput"
               placeholder="Dein Text..."
               oninput="updateText()">

      </div>


      <div class="section">

        <div class="section-title">
          Sticker
        </div>

        <div class="options">

          <button class="option"
                  onclick="setSticker('★')">
            ★
          </button>

          <button class="option"
                  onclick="setSticker('✦')">
            ✦
          </button>

          <button class="option"
                  onclick="setSticker('♛')">
            ♛
          </button>

          <button class="option"
                  onclick="setSticker('')">
            ×
          </button>

        </div>

      </div>


      <div class="section">

        <div class="section-title">
          Verformung
        </div>

        <div class="options">

          <button class="option"
                  onclick="toggleMesh()">
            Mesh anzeigen
          </button>

          <button class="option"
                  onclick="resetShape()">
            Form zurücksetzen
          </button>

        </div>

      </div>


      <div class="section">

        <div class="section-title">
          Verformungsstärke
        </div>

        <input type="range"
               id="strengthSlider"
               min="40"
               max="150"
               value="85">

      </div>


      <div class="section">

        <div class="section-title">
          Größe
        </div>

        <input type="range"
               min="70"
               max="120"
               value="100"
               oninput="resizeGarment(this.value)">

      </div>


      <div class="section">

        <div class="section-title">
          Projekt
        </div>

        <div class="action-row">

          <button class="action"
                  onclick="saveDesign()">
            Speichern
          </button>

          <button class="action secondary"
                  onclick="loadDesign()">
            Laden
          </button>

          <button class="action secondary"
                  onclick="resetDesign()">
            Reset
          </button>

        </div>

      </div>

    </div>

  </div>

</div>

/* =========================================================
   BASISFORM AUSWÄHLEN
========================================================= */

function getStylePoints(){

  if(currentGarment==="shirt"){
    return shirtStyles[currentStyle];
  }

  if(currentGarment==="formal"){
    return formalStyles[currentStyle];
  }

  return pantsStyles[currentStyle];
}


/* =========================================================
   MESH AUFBAU
========================================================= */

function buildMesh(){

  const base=getStylePoints();

  boundaryPoints=
    base.map(p=>({...p}));

  mesh=[];

  const minX=Math.min(...base.map(p=>p.x));
  const maxX=Math.max(...base.map(p=>p.x));
  const minY=Math.min(...base.map(p=>p.y));
  const maxY=Math.max(...base.map(p=>p.y));

  /*
    Dichtes internes Mesh.
    Mehr Punkte = weichere Verformung.
  */

  const columns=15;
  const rows=21;

  for(let row=0;row<=rows;row++){

    const y=
      minY+
      (maxY-minY)*(row/rows);

    for(let col=0;col<=columns;col++){

      const x=
        minX+
        (maxX-minX)*(col/columns);

      mesh.push({
        x:x,
        y:y,
        ox:x,
        oy:y,
        inside:isInsidePolygon(x,y,base)
      });
    }
  }

  /*
    Randpunkte zusätzlich als echte Kleidungsform.
  */

  base.forEach((p,index)=>{

    mesh.push({
      x:p.x,
      y:p.y,
      ox:p.x,
      oy:p.y,
      boundary:true,
      boundaryIndex:index,
      inside:true
    });

  });

  renderMesh();
}


/* =========================================================
   POINT-IN-POLYGON
========================================================= */

function isInsidePolygon(x,y,polygon){

  let inside=false;

  for(
    let i=0,j=polygon.length-1;
    i<polygon.length;
    j=i++
  ){

    const xi=polygon[i].x;
    const yi=polygon[i].y;

    const xj=polygon[j].x;
    const yj=polygon[j].y;

    const intersect=
      ((yi>y)!==(yj>y)) &&
      (
        x <
        (xj-xi)*(y-yi)/(yj-yi)+xi
      );

    if(intersect){
      inside=!inside;
    }
  }

  return inside;
}


/* =========================================================
   MESH RENDER
========================================================= */

function renderMesh(){

  meshLines.innerHTML="";
  meshPointsGroup.innerHTML="";

  const visibleMesh=
    mesh.filter(p=>p.inside);

  visibleMesh.forEach(point=>{

    const circle=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    circle.setAttribute(
      "cx",
      point.x
    );

    circle.setAttribute(
      "cy",
      point.y
    );

    circle.setAttribute(
      "r",
      point.boundary ? 5 : 3
    );

    circle.setAttribute(
      "class",
      "mesh-point"
    );

    meshPointsGroup.appendChild(circle);

  });
}


/* =========================================================
   FORM AUS MESH BERECHNEN
========================================================= */

function getCurrentBoundary(){

  const base=getStylePoints();

  return base.map((basePoint,index)=>{

    const boundary=
      mesh.find(
        p=>
          p.boundary &&
          p.boundaryIndex===index
      );

    if(boundary){

      return {
        x:boundary.x,
        y:boundary.y
      };
    }

    return {
      x:basePoint.x,
      y:basePoint.y
    };

  });
}


/* =========================================================
   GLATTER PATH
========================================================= */

function createPath(arr){

  if(!arr.length){
    return "";
  }

  let d=
    `M ${arr[0].x} ${arr[0].y}`;

  for(let i=1;i<arr.length;i++){

    const current=arr[i];

    const next=
      arr[(i+1)%arr.length];

    const midX=
      (current.x+next.x)/2;

    const midY=
      (current.y+next.y)/2;

    d+=
      ` Q ${current.x} ${current.y}
      ${midX} ${midY}`;
  }

  const first=arr[0];
  const second=arr[1];

  d+=
    ` Q ${first.x} ${first.y}
    ${(first.x+second.x)/2}
    ${(first.y+second.y)/2} Z`;

  return d;
}

/* =========================================================
   ECHTE FINGER-VERFORMUNG
========================================================= */

svg.addEventListener(
  "pointerdown",
  startDrag
);

window.addEventListener(
  "pointermove",
  moveDrag,
  {passive:false}
);

window.addEventListener(
  "pointerup",
  stopDrag
);

window.addEventListener(
  "pointercancel",
  stopDrag
);


function startDrag(event){

  const pos=
    getSVGPoint(event);

  if(!isInsideGarment(
    pos.x,
    pos.y,
    getCurrentBoundary()
  )){
    return;
  }

  dragging=true;
  lastPointer=pos;

  document.body.classList.add("touching");

  try{
    svg.setPointerCapture(
      event.pointerId
    );
  }catch(e){}

  event.preventDefault();
}


function moveDrag(event){

  if(!dragging || !lastPointer){
    return;
  }

  event.preventDefault();

  const pos=
    getSVGPoint(event);

  const dx=
    pos.x-lastPointer.x;

  const dy=
    pos.y-lastPointer.y;

  if(
    Math.abs(dx)+Math.abs(dy)
    <0.25
  ){
    return;
  }

  deformMesh(
    lastPointer.x,
    lastPointer.y,
    dx,
    dy
  );

  lastPointer=pos;
}


function stopDrag(){

  dragging=false;
  lastPointer=null;

  document.body.classList.remove("touching");
}


/* =========================================================
   WEICHE MESH-DEFORMATION
========================================================= */

function deformMesh(cx,cy,dx,dy){

  const strength=
    Number(
      document.getElementById(
        "strengthSlider"
      ).value
    )/100;

  const radius=
    58+
    strength*58;

  mesh.forEach(point=>{

    if(!point.inside){
      return;
    }

    const distance=
      Math.hypot(
        point.x-cx,
        point.y-cy
      );

    if(distance>radius){
      return;
    }

    let influence=
      1-(distance/radius);

    /*
      Smoothes Stoffbewegung.
    */

    influence=
      influence*influence*
      (3-2*influence);

    /*
      Randpunkte dürfen stärker
      reagieren, damit Ärmel,
      Hosenbeine und Seiten gut
      verändert werden können.
    */

    if(point.boundary){
      influence*=1.18;
    }

    point.x+=
      dx*influence;

    point.y+=
      dy*influence;

  });

  /*
    Sicherheitsgrenzen.
    */

  mesh.forEach(point=>{

    point.x=
      Math.max(
        -80,
        Math.min(
          480,
          point.x
        )
      );

    point.y=
      Math.max(
        -60,
        Math.min(
          600,
          point.y
        )
      );

  });

  drawGarment();
}


/* =========================================================
   SVG KOORDINATEN
========================================================= */

function getSVGPoint(event){

  const rect=
    svg.getBoundingClientRect();

  return {

    x:
      (event.clientX-rect.left)
      *400/rect.width,

    y:
      (event.clientY-rect.top)
      *540/rect.height

  };
}


/* =========================================================
   FORM-INNENBEREICH
========================================================= */

function isInsideGarment(
  x,
  y,
  polygon
){

  return isInsidePolygon(
    x,
    y,
    polygon
  );
}

/* =========================================================
   LADEN
========================================================= */

function loadDesign(){

  const saved=
    localStorage.getItem(
      "arveDesign"
    );

  if(!saved){

    alert(
      "Noch kein Design gespeichert."
    );

    return;
  }

  try{

    const data=
      JSON.parse(saved);

    currentGarment=
      data.garment||"shirt";

    currentStyle=
      data.style||"classic";

    currentColor=
      data.color||"#eee6d4";

    currentPattern=
      data.pattern||"none";

    currentSticker=
      data.sticker||"";

    currentText=
      data.text||"";

    garmentScale=
      data.scale||1;


    document.querySelectorAll(
      ".tool-btn"
    ).forEach(btn=>{
      btn.classList.remove("active");
    });


    if(currentGarment==="pants"){

      document.getElementById(
        "pantsButton"
      ).classList.add("active");

    }else if(currentGarment==="formal"){

      document.getElementById(
        "formalButton"
      ).classList.add("active");

    }else{

      document.getElementById(
        "shirtButton"
      ).classList.add("active");
    }


    renderStyleButtons();


    if(
      Array.isArray(data.mesh)
      &&
      data.mesh.length
    ){

      mesh=data.mesh;

    }else{

      buildMesh();
    }


    document.getElementById(
      "textInput"
    ).value=currentText;

    document.getElementById(
      "colorPicker"
    ).value=currentColor;

    garmentWrap.style.transform=
      `scale(${garmentScale})`;

    setSticker(currentSticker);
    setPattern(currentPattern);

    drawGarment();

  }catch(error){

    alert(
      "Das gespeicherte Design konnte nicht geladen werden."
    );

  }
}
