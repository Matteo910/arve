<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARVÉ — Clothing Studio</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --black:#070807;
  --dark:#101411;
  --green:#17382d;
  --green2:#244d3d;
  --wine:#641f2b;
  --cream:#eee6d4;
  --gold:#b8a16a;
  --line:rgba(184,161,106,.34);
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:
    radial-gradient(circle at 50% -5%,#284538 0%,transparent 38%),
    linear-gradient(180deg,#080a08,#050605);
  color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  padding:20px;
  text-align:center;
  background:rgba(7,8,7,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.logo{
  font-size:31px;
  letter-spacing:8px;
  font-weight:bold;
}

.subtitle{
  margin-top:5px;
  color:var(--gold);
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
}

.app{
  width:min(1150px,100%);
  margin:auto;
  padding:18px;
}

.toolbar,
.stylebar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.toolbar::-webkit-scrollbar,
.stylebar::-webkit-scrollbar{
  display:none;
}

.tool,
.style{
  flex:0 0 auto;
  color:var(--cream);
  background:#0c100d;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 16px;
  cursor:pointer;
}

.tool.active,
.tool:hover,
.style.active,
.style:hover{
  background:var(--green);
  border-color:var(--gold);
}

.stylebar{
  margin:10px 0 15px;
  padding-bottom:4px;
}

.style{
  font-size:12px;
  padding:8px 12px;
}

.editor{
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:18px;
}

@media(max-width:820px){
  .editor{
    grid-template-columns:1fr;
  }
}

.canvas-card,
.panel{
  border:1px solid var(--line);
  background:rgba(15,19,16,.94);
  border-radius:19px;
  box-shadow:0 22px 65px rgba(0,0,0,.42);
}

.canvas-card{
  min-height:650px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  overflow:hidden;
}

.canvas{
  width:min(100%,540px);
  aspect-ratio:4/5;
  position:relative;
}

#wrap{
  position:absolute;
  inset:0;
  touch-action:none;
  transform-origin:center;
}

svg{
  width:100%;
  height:100%;
  overflow:visible;
  user-select:none;
  touch-action:none;
}

#garment{
  stroke:#090a09;
  stroke-width:2.2;
  stroke-linejoin:round;
  filter:url(#clothShadow);
}

#volume{
  pointer-events:none;
}

#highlight{
  pointer-events:none;
  opacity:.8;
}

#shade{
  pointer-events:none;
  opacity:.65;
}

.detail{
  fill:none;
  stroke:rgba(20,20,18,.48);
  stroke-width:1.5;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.detailLight{
  fill:none;
  stroke:rgba(255,255,255,.13);
  stroke-width:1.2;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.stitch{
  fill:none;
  stroke:rgba(25,25,22,.40);
  stroke-width:1;
  stroke-dasharray:3 3;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.fold{
  fill:none;
  stroke:rgba(0,0,0,.19);
  stroke-width:3;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.foldLight{
  fill:none;
  stroke:rgba(255,255,255,.12);
  stroke-width:2;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

#pattern{
  pointer-events:none;
  opacity:.22;
}

.patternDark{
  stroke:#111;
  fill:#111;
}

.collar{
  fill:rgba(255,255,255,.035);
  stroke:rgba(10,10,10,.55);
  stroke-width:1.7;
  pointer-events:none;
}

.pocket{
  fill:rgba(255,255,255,.025);
  stroke:rgba(15,15,15,.50);
  stroke-width:1.5;
  pointer-events:none;
}

.button{
  fill:#171817;
  stroke:rgba(255,255,255,.25);
  stroke-width:1;
  pointer-events:none;
}

#mesh circle{
  fill:var(--gold);
  stroke:#050505;
  stroke-width:1;
  opacity:0;
  pointer-events:none;
}

.showMesh #mesh circle{
  opacity:.65;
}

#designText,
#sticker{
  position:absolute;
  pointer-events:none;
  z-index:10;
  left:50%;
  transform:translate(-50%,-50%);
}

#designText{
  top:48%;
  font-size:25px;
  font-weight:bold;
  color:#111;
  white-space:nowrap;
}

#sticker{
  top:58%;
  font-size:43px;
}

.hint{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(238,230,212,.5);
  font-size:11px;
  white-space:nowrap;
}

.panel{
  padding:17px;
}

.panel h2{
  margin:0 0 17px;
  color:var(--gold);
  font-size:19px;
}

.section{
  margin-bottom:19px;
}

.label{
  margin-bottom:8px;
  color:#aaa08c;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.option,
.action{
  color:var(--cream);
  background:#0b0f0c;
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 11px;
  cursor:pointer;
}

.option:hover,
.action:hover{
  border-color:var(--gold);
  background:var(--green);
}

input[type=color]{
  width:48px;
  height:38px;
  padding:3px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#0b0f0c;
}

input[type=range]{
  width:100%;
  accent-color:var(--gold);
}

.text{
  width:100%;
  padding:11px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#090c0a;
  color:var(--cream);
  outline:none;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.action{
  flex:1;
  min-width:90px;
}

.dragging svg{
  cursor:grabbing;
}
</style>
</head>

<header>
  <div class="logo">ARVÉ</div>
  <div class="subtitle">Create Your Own</div>
</header>

<div class="app">

  <div class="toolbar">
    <button id="btnShirt" class="tool active" onclick="changeGarment('shirt')">T-Shirt</button>

                <stop offset="18%" stop-color="#ffffff" stop-opacity=".07"/>
                <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
                <stop offset="72%" stop-color="#000000" stop-opacity=".08"/>
                <stop offset="100%" stop-color="#000000" stop-opacity=".28"/>

              </linearGradient>

              <linearGradient id="volumeGradient"
                              x1="0"
                              y1="0"
                              x2="1"
                              y2="0">

                <stop offset="18%" stop-color="#000" stop-opacity="0"/>
                <stop offset="50%" stop-color="#fff" stop-opacity=".08"/>
                <stop offset="82%" stop-color="#000" stop-opacity="0"/>
                <stop offset="100%" stop-color="#000" stop-opacity=".23"/>

                <stop offset="50%" stop-color="#fff" stop-opacity=".04"/>

              </filter>

              <clipPath id="clip">
                <path id="clipPath"></path>

            </defs>

            <g id="details"></g>

        </div>

        <div id="sticker"></div>

      </div>

      <div class="hint">
        Ziehe mit dem Finger direkt am Stoff
      </div>

    </div>


    <div class="panel">

      <h2>Arvé Studio</h2>

      <div class="section">

        <div class="label">Kleidungsstück</div>

        <div class="options">
          <button class="option" onclick="changeGarment('shirt')">T-Shirt</button>
          <button class="option" onclick="changeGarment('formal')">Hemd</button>

        <div id="styles" class="options"></div>

          <button class="option" onclick="setColor('#111311')">Black</button>
          <button class="option" onclick="setColor('#17382d')">Green</button>

        </div>

      </div>

      <div class="section">

        <div class="label">Muster</div>

        <div class="options">
          <button class="option" onclick="setPattern('none')">Clean</button>
          <button class="option" onclick="setPattern('dots')">Dots</button>
          <button class="option" onclick="setPattern('lines')">Lines</button>
          <button class="option" onclick="setPattern('grid')">Grid</button>
        </div>

      </div>

      <div class="section">

        <div class="label">Text</div>

        <input id="text"
               class="text"

      </div>

      <div class="section">

        <div class="label">Sticker</div>

          <button class="option" onclick="setSticker('★')">★</button>
          <button class="option" onclick="setSticker('✦')">✦</button>

      <div class="section">

          <button class="option" onclick="resetShape()">Form zurücksetzen</button>

      </div>

      </div>

      <div class="section">

        <div class="actions">

          <button class="action" onclick="load()">Laden</button>
          <button class="action" onclick="resetAll()">Reset</button>
        </div>

      </div>

    </div>

  </div>
</div>

function renderStyles(){

  stylesBox.innerHTML="";

  Object.keys(labels[type]).forEach(key=>{

    const b=document.createElement("button");

    b.className=
      "style"+
      (key===style?" active":"");

    b.textContent=labels[type][key];

    b.onclick=()=>{
      style=key;
      resetShape();
      renderStyles();
    };

    stylesBox.appendChild(b);

  });
}


/* =========================
   MESH
========================= */

function resetShape(){

  basePoints=
    clothing[type][style]
      .map(p=>({x:p[0],y:p[1]}));

  points=
    basePoints.map(p=>({...p}));

  buildMesh();
  render();

}


function buildMesh(){

  mesh=[];

  const minX=Math.min(...basePoints.map(p=>p.x));
  const maxX=Math.max(...basePoints.map(p=>p.x));
  const minY=Math.min(...basePoints.map(p=>p.y));
  const maxY=Math.max(...basePoints.map(p=>p.y));

  const cols=15;
  const rows=22;

  for(let r=0;r<=rows;r++){

    for(let c=0;c<=cols;c++){

      const x=
        minX+
        (maxX-minX)*c/cols;

      const y=
        minY+
        (maxY-minY)*r/rows;

      mesh.push({
        x,
        y,
        ox:x,
        oy:y,
        inside:inside(x,y,basePoints)
      });

    }

  }

  points.forEach((p,i)=>{

    mesh.push({
      x:p.x,
      y:p.y,
      ox:p.x,
      oy:p.y,
      inside:true,
      boundary:true,
      index:i
    });

  });

  renderMesh();

}


function inside(x,y,poly){

  let result=false;

  for(
    let i=0,j=poly.length-1;
    i<poly.length;
    j=i++
  ){

    const xi=poly[i].x;
    const yi=poly[i].y;

    const xj=poly[j].x;
    const yj=poly[j].y;

    const hit=
      ((yi>y)!==(yj>y)) &&
      x<
      (xj-xi)*(y-yi)/(yj-yi)+xi;

    if(hit) result=!result;

  }

  return result;

}


function renderMesh(){

  meshGroup.innerHTML="";

  mesh
    .filter(p=>p.inside)
    .forEach(p=>{

      const c=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );

      c.setAttribute("cx",p.x);
      c.setAttribute("cy",p.y);
      c.setAttribute("r",p.boundary?4.5:2.4);

      meshGroup.appendChild(c);

    });

}


/* =========================
   PATH
========================= */

function smoothPath(arr){

  let d=`M ${arr[0].x} ${arr[0].y}`;

  for(let i=1;i<arr.length;i++){

    const p=arr[i];
    const n=arr[(i+1)%arr.length];

    d+=
      ` Q ${p.x} ${p.y}
      ${(p.x+n.x)/2}
      ${(p.y+n.y)/2}`;

  }

  const a=arr[0];
  const b=arr[1];

  d+=
    ` Q ${a.x} ${a.y}
    ${(a.x+b.x)/2}
    ${(a.y+b.y)/2} Z`;

  return d;

}


/* =========================
   RENDER
========================= */

function render(){

  const d=smoothPath(points);

  garment.setAttribute("d",d);
  clipPath.setAttribute("d",d);
  volume.setAttribute("d",d);
  highlight.setAttribute("d",d);
  shade.setAttribute("d",d);

  garment.style.fill=color;

  drawDetails();
  drawFolds();
  drawPattern();
  renderMesh();

}

/* =========================
   MUSTER
========================= */

function setPattern(value){

  patternType=value;
  drawPattern();

}


function drawPattern(){

  pattern.innerHTML="";

  if(patternType==="none") return;

  if(patternType==="dots"){

    for(let x=50;x<=350;x+=22){

      for(let y=50;y<=500;y+=22){

        const c=
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
          );

        c.setAttribute("cx",x);
        c.setAttribute("cy",y);
        c.setAttribute("r",2);

        c.setAttribute(
          "class",
          "patternDark"
        );

        pattern.appendChild(c);

      }

    }

  }


  if(patternType==="lines"){

    for(let x=-400;x<800;x+=20){

      const l=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      l.setAttribute("x1",x);
      l.setAttribute("y1",0);
      l.setAttribute("x2",x+500);
      l.setAttribute("y2",540);
      l.setAttribute("class","patternDark");
      l.setAttribute("stroke-width","2");

      pattern.appendChild(l);

    }

  }


  if(patternType==="grid"){

    for(let x=30;x<400;x+=25){

      const l=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      l.setAttribute("x1",x);
      l.setAttribute("y1",0);
      l.setAttribute("x2",x);
      l.setAttribute("y2",540);
      l.setAttribute("class","patternDark");
      l.setAttribute("stroke-width","1");

      pattern.appendChild(l);

    }

    for(let y=25;y<540;y+=25){

      const l=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      l.setAttribute("x1",0);
      l.setAttribute("y1",y);
      l.setAttribute("x2",400);
      l.setAttribute("y2",y);
      l.setAttribute("class","patternDark");
      l.setAttribute("stroke-width","1");

      pattern.appendChild(l);

    }

  }

}


/* =========================
   VERFORMUNG
========================= */

svg.addEventListener("pointerdown",e=>{

  const p=getPoint(e);

  if(!inside(p.x,p.y,points)){
    return;
  }

  dragging=true;
  last=p;

  document.body.classList.add("dragging");

  try{
    svg.setPointerCapture(e.pointerId);
  }catch(err){}

  e.preventDefault();

});


window.addEventListener(
  "pointermove",
  e=>{

    if(!dragging||!last) return;

    e.preventDefault();

    const p=getPoint(e);

    const dx=p.x-last.x;
    const dy=p.y-last.y;

    deform(last.x,last.y,dx,dy);

    last=p;

  },
  {passive:false}
);


window.addEventListener(
  "pointerup",
  stopDrag
);

window.addEventListener(
  "pointercancel",
  stopDrag
);


function stopDrag(){

  dragging=false;
  last=null;

  document.body.classList.remove("dragging");

}


function deform(cx,cy,dx,dy){

  const strength=
    Number(
      document.getElementById("strength").value
    )/100;

  const radius=
    60+strength*60;

  mesh.forEach(p=>{

    if(!p.inside) return;

    const distance=
      Math.hypot(
        p.x-cx,
        p.y-cy
      );

    if(distance>radius) return;

    let influence=
      1-distance/radius;

    /* sehr weicher Übergang */

    influence=
      influence*influence*
      (3-2*influence);

    if(p.boundary){
      influence*=1.35;
    }

    p.x+=dx*influence;
    p.y+=dy*influence;

  });


  mesh.forEach(p=>{

    p.x=Math.max(-100,Math.min(500,p.x));
    p.y=Math.max(-80,Math.min(620,p.y));

  });


  points=
    basePoints.map((original,i)=>{

      const p=
        mesh.find(
          m=>
            m.boundary &&
            m.index===i
        );

      return p
        ? {x:p.x,y:p.y}
        : {...original};

    });


  render();

}


function getPoint(e){

  const r=
    svg.getBoundingClientRect();

  return{
    x:(e.clientX-r.left)*400/r.width,
    y:(e.clientY-r.top)*540/r.height
  };

}

/* =========================
   SPEICHERN
========================= */

function save(){

  const data={
    type,
    style,
    color,
    patternType,
    textValue,
    sticker,
    scale,

    mesh:mesh.map(p=>({
      x:p.x,
      y:p.y,
      ox:p.ox,
      oy:p.oy,
      inside:p.inside,
      boundary:p.boundary,
      index:p.index
    }))
  };

  localStorage.setItem(
    "arveDesign3D",
    JSON.stringify(data)
  );

  alert("Arvé Design gespeichert.");
}


/* =========================
   LADEN
========================= */

function load(){

  const saved=
    localStorage.getItem("arveDesign3D");

  if(!saved){
    alert("Noch kein gespeichertes Design.");
    return;
  }

  try{

    const data=JSON.parse(saved);

    type=data.type||"shirt";
    style=data.style||"classic";
    color=data.color||"#eee6d4";
    patternType=data.patternType||"none";
    textValue=data.textValue||"";
    sticker=data.sticker||"";
    scale=data.scale||1;

    renderStyles();

    basePoints=
      clothing[type][style]
        .map(p=>({x:p[0],y:p[1]}));

    if(Array.isArray(data.mesh)){

      mesh=data.mesh;

      points=
        basePoints.map((p,i)=>{

          const m=
            mesh.find(
              x=>x.boundary&&x.index===i
            );

          return m
            ? {x:m.x,y:m.y}
            : {...p};

        });

    }else{

      resetShape();

    }

    document.getElementById("text").value=textValue;
    document.getElementById("color").value=color;

    wrap.style.transform=
      `scale(${scale})`;

    document.getElementById(
      "designText"
    ).textContent=textValue;

    document.getElementById(
      "sticker"
    ).textContent=sticker;

    render();

  }catch(e){

    alert("Das Design konnte nicht geladen werden.");

  }

}

   RESET
========================= */

function resetAll(){

  type="shirt";
  style="classic";
  color="#eee6d4";
  patternType="none";
  textValue="";
  sticker="";
  scale=1;

  document.getElementById("text").value="";
  document.getElementById("color").value=color;

  wrap.style.transform="scale(1)";

  document.getElementById("designText").textContent="";
  document.getElementById("sticker").textContent="";

  document
    .querySelectorAll(".tool")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById("btnShirt").classList.add("active");

  renderStyles();
  resetShape();

}
