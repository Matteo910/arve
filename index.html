<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Arvé</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --black:#080908;
  --dark:#101411;
  --green:#17382d;
  --green-light:#244d3d;
  --wine:#641f2b;
  --cream:#eee6d4;
  --gold:#b8a16a;
  --border:rgba(184,161,106,.35);
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 0%,#16251e 0%,transparent 45%),
    var(--black);
  color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

header{
  padding:22px 18px 16px;
  text-align:center;
  border-bottom:1px solid var(--border);
  background:rgba(8,9,8,.88);
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:31px;
  letter-spacing:7px;
  color:var(--cream);
  font-weight:bold;
}

.subtitle{
  margin-top:5px;
  font-size:11px;
  letter-spacing:3px;
  color:var(--gold);
  text-transform:uppercase;
}

.app{
  width:min(1100px,100%);
  margin:auto;
  padding:18px;
}

.toolbar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
  display:none;
}

.tool-btn,
.style-btn,
.option,
.action{
  cursor:pointer;
  color:var(--cream);
  transition:.18s ease;
}

.tool-btn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--dark);
  padding:11px 16px;
  border-radius:9px;
}

.tool-btn:hover,
.tool-btn.active{
  background:var(--green);
  border-color:var(--gold);
}

.style-bar{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  margin-bottom:12px;
  padding:2px 0 7px;
}

.style-bar::-webkit-scrollbar{
  display:none;
}

.style-btn{
  flex:0 0 auto;
  border:1px solid rgba(184,161,106,.22);
  background:#0c100d;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
}

.style-btn.active,
.style-btn:hover{
  background:var(--wine);
  border-color:var(--gold);
}

.editor{
  display:grid;
  grid-template-columns:1fr 300px;
  gap:18px;
}

@media(max-width:800px){
  .editor{
    grid-template-columns:1fr;
  }
}

.canvas-card,
.panel{
  background:rgba(16,20,17,.9);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}

.canvas-card{
  min-height:620px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  position:relative;
  overflow:hidden;
}

.canvas{
  width:min(100%,480px);
  aspect-ratio:4/5;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.garment-wrap{
  width:82%;
  height:88%;
  position:relative;
  transform-origin:center;
}

#garmentSvg{
  width:100%;
  height:100%;
  overflow:visible;
}

#garmentPath{
  fill:#eee6d4;
  stroke:#111;
  stroke-width:2;
  vector-effect:non-scaling-stroke;
}

.garment-detail{
  pointer-events:none;
  fill:none;
  stroke:rgba(20,20,20,.38);
  stroke-width:1.5;
  vector-effect:non-scaling-stroke;
}

.garment-detail-light{
  pointer-events:none;
  fill:none;
  stroke:rgba(255,255,255,.28);
  stroke-width:1;
  vector-effect:non-scaling-stroke;
}

.deform-point{
  fill:var(--gold);
  stroke:#080908;
  stroke-width:2;
  r:7;
  cursor:grab;
  touch-action:none;
}

.deform-point:active{
  cursor:grabbing;
}

.panel{
  padding:17px;
}

.panel h2{
  margin:0 0 15px;
  font-size:18px;
  color:var(--gold);
}

.section{
  margin-bottom:20px;
}

.section-title{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#a99e87;
  margin-bottom:9px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.option{
  border:1px solid var(--border);
  background:#0c100d;
  padding:9px 11px;
  border-radius:8px;
}

.option.active,
.option:hover{
  background:var(--green);
  border-color:var(--gold);
}

input[type="color"]{
  width:48px;
  height:38px;
  padding:3px;
  border:1px solid var(--border);
  background:var(--dark);
  border-radius:8px;
}

input[type="range"]{
  width:100%;
  accent-color:var(--gold);
}

.text-input{
  width:100%;
  background:#0b0e0c;
  color:var(--cream);
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px;
  outline:none;
}

.action-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.action{
  flex:1;
  min-width:100px;
  padding:11px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--green);
}

.action.secondary{
  background:#0c100d;
}

#designText{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#111;
  font-size:26px;
  font-weight:bold;
  pointer-events:none;
  text-align:center;
  white-space:nowrap;
}

.sticker{
  position:absolute;
  font-size:42px;
  left:50%;
  top:55%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.pattern-overlay{
  position:absolute;
  inset:5%;
  border-radius:20px;
  pointer-events:none;
  opacity:.22;
  mix-blend-mode:multiply;
}

.pattern-dots{
  background-image:radial-gradient(#111 2px,transparent 2px);
  background-size:15px 15px;
}

.pattern-lines{
  background-image:repeating-linear-gradient(
    45deg,
    #111 0,
    #111 2px,
    transparent 2px,
    transparent 13px
  );
}

.pattern-grid{
  background-image:
    linear-gradient(#111 1px,transparent 1px),
    linear-gradient(90deg,#111 1px,transparent 1px);
  background-size:18px 18px;
}

.hint{
  position:absolute;
  bottom:13px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(238,230,212,.5);
  font-size:11px;
  white-space:nowrap;
}

/* HOSEN */
.pants-pocket{
  fill:none;
  stroke:rgba(20,20,20,.5);
  stroke-width:2;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.pants-seam{
  fill:none;
  stroke:rgba(20,20,20,.35);
  stroke-width:1.6;
  stroke-dasharray:5 4;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.pants-waist{
  fill:none;
  stroke:rgba(20,20,20,.55);
  stroke-width:2;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.pants-belt-loop{
  fill:none;
  stroke:rgba(20,20,20,.45);
  stroke-width:3;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

</head>

<header>
  <div class="logo">ARVÉ</div>
  <div class="subtitle">Create Your Own</div>
</header>

<div class="app">

  <div class="toolbar">

    <button
      class="tool-btn active"
      id="shirtButton"
      onclick="selectGarment('shirt',this)">
      T-Shirt
    </button>

    <button
      class="tool-btn"
      id="formalButton"
      onclick="selectGarment('formal',this)">
      Hemd
    </button>

    <button
      class="tool-btn"
      id="pantsButton"

      Hose
    </button>

  </div>

  <div class="style-bar" id="styleBar"></div>

  <div class="editor">

    <div class="canvas-card">

      <div class="canvas" id="canvas">

        <div class="garment-wrap">

          <svg
            id="garmentSvg"
            viewBox="0 0 400 540"
            preserveAspectRatio="xMidYMid meet">

            <path id="garmentPath"></path>

            <g id="garmentDetails"></g>

            <path
              id="fabricLight"
              fill="rgba(255,255,255,.08)"
              opacity=".35">
            </path>

            <g id="deformPoints"></g>

          </svg>

        </div>

        <div
          class="pattern-overlay"
          id="patternOverlay">
        </div>

        <div id="designText"></div>

        <div
          class="sticker"
          id="sticker">
        </div>

      </div>

      <div class="hint">
        Ziehe die goldenen Punkte, um die Form zu verändern
      </div>

    </div>

    <div class="panel">

      <h2>Arvé Studio</h2>

      <div class="section">

        <div class="section-title">Farbe</div>

        <div class="options">

          <button
            class="option"
            onclick="setColor('#eee6d4')">
            Cream
          </button>

          <button
            class="option"
            onclick="setColor('#111311')">
            Black
          </button>

          <button
            class="option"
            onclick="setColor('#17382d')">
            Green
          </button>

          <button
            class="option"
            onclick="setColor('#641f2b')">
            Wine
          </button>

          <input
            type="color"
            id="colorPicker"
            value="#eee6d4"
            onchange="setColor(this.value)">

        </div>
      </div>

      <div class="section">

        <div class="section-title">Muster</div>

        <div class="options">

          <button
            class="option"
            onclick="setPattern('none')">
            Clean
          </button>

          <button
            class="option"
            onclick="setPattern('dots')">
            Dots
          </button>

          <button
            class="option"
            onclick="setPattern('lines')">
            Lines
          </button>

          <button
            class="option"
            onclick="setPattern('grid')">
            Grid
          </button>

        </div>
      </div>

      <div class="section">

        <div class="section-title">Text</div>

        <input
          class="text-input"
          id="textInput"
          placeholder="Dein Text..."
          oninput="updateText()">

      </div>

      <div class="section">

        <div class="section-title">Sticker</div>

        <div class="options">

          <button
            class="option"
            onclick="setSticker('★')">
            ★
          </button>

          <button
            class="option"
            onclick="setSticker('✦')">
            ✦
          </button>

          <button
            class="option"
            onclick="setSticker('♛')">
            ♛
          </button>

          <button
            class="option"
            onclick="setSticker('')">
            ×
          </button>

        </div>
      </div>

      <div class="section">

        <div class="section-title">Größe</div>

        <input
          type="range"
          min="70"
          max="120"
          value="100"
          oninput="resizeGarment(this.value)">

      </div>

      <div class="section">

        <div class="section-title">Projekt</div>

        <div class="action-row">

          <button
            class="action"
            onclick="saveDesign()">
            Speichern
          </button>

          <button
            class="action secondary"
            onclick="loadDesign()">
            Laden
          </button>

          <button
            class="action secondary"
            onclick="resetDesign()">
            Reset
          </button>

        </div>
      </div>

    </div>
  </div>
</div>

/* =====================================================
   SCHNITT-DATEN LADEN
===================================================== */

function getStylePoints(){

  if(currentGarment === "shirt"){
    return shirtStyles[currentStyle];
  }

  if(currentGarment === "formal"){
    return formalStyles[currentStyle];
  }

  return pantsStyles[currentStyle];
}


/* =====================================================
   KLEIDUNGSART AUSWÄHLEN
===================================================== */

function selectGarment(type,button){

  currentGarment = type;

  const buttons =
    document.querySelectorAll(".tool-btn");

  buttons.forEach(btn=>{
    btn.classList.remove("active");
  });

  if(button){
    button.classList.add("active");
  }

  const availableStyles =
    Object.keys(styleNames[type]);

  if(!availableStyles.includes(currentStyle)){
    currentStyle = availableStyles[0];
  }

  renderStyleButtons();

  points =
    getStylePoints().map(point=>({...point}));

  drawGarment();
}


/* =====================================================
   SCHNITT AUSWÄHLEN
===================================================== */

function selectStyle(style){

  currentStyle = style;

  points =
    getStylePoints().map(point=>({...point}));

  renderStyleButtons();
  drawGarment();
}


/* =====================================================
   SCHNITT-BUTTONS
===================================================== */

function renderStyleButtons(){

  styleBar.innerHTML = "";

  const styles =
    styleNames[currentGarment];

  Object.keys(styles).forEach(style=>{

    const button =
      document.createElement("button");

    button.className =
      "style-btn" +
      (style === currentStyle ? " active" : "");

    button.textContent =
      styles[style];

    button.onclick =
      ()=>selectStyle(style);

    styleBar.appendChild(button);
  });
}


/* =====================================================
   GLATTER SVG-PFAD
===================================================== */

function createPath(pointArray){

  if(!pointArray.length){
    return "";
  }

  let d =
    `M ${pointArray[0].x} ${pointArray[0].y}`;

  for(let i=1;i<pointArray.length;i++){

    const current =
      pointArray[i];

    const next =
      pointArray[(i+1)%pointArray.length];

    const midX =
      (current.x + next.x) / 2;

    const midY =
      (current.y + next.y) / 2;

    d +=
      ` Q ${current.x} ${current.y} ${midX} ${midY}`;
  }

  const first =
    pointArray[0];

  const second =
    pointArray[1];

  d +=
    ` Q ${first.x} ${first.y} ${(first.x+second.x)/2} ${(first.y+second.y)/2}`;

  d += " Z";

  return d;
}


/* =====================================================
   KLEIDUNGSSTÜCK ZEICHNEN
===================================================== */

function drawGarment(){

  const path =
    createPath(points);

/* =====================================================
   DETAIL HELPER
===================================================== */

function addDetail(pathData,className){

  const path =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

  path.setAttribute(
    "d",
    pathData
  );

    "class",
    className
  );

  garmentDetails.appendChild(path);
}


/* =====================================================
   VERFORMUNGSPUNKTE
===================================================== */

function drawPoints(){

  deformPointsGroup.innerHTML = "";

  points.forEach((point,index)=>{

    const circle =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    circle.setAttribute(
      "cx",
      point.x
    );

    circle.setAttribute(
      "cy",
      point.y
    );

    circle.setAttribute(
      "class",
      "deform-point"
    );

    circle.dataset.index =
      index;

    circle.addEventListener(
      "pointerdown",
      startDrag
    );

    deformPointsGroup.appendChild(circle);
  });
}


/* =====================================================
   TOUCH / MAUS START
===================================================== */

function startDrag(event){

  event.preventDefault();

  draggingPoint =
    Number(event.currentTarget.dataset.index);

  try{
    event.currentTarget.setPointerCapture(
      event.pointerId
    );
  }catch(e){}

  window.addEventListener(
    "pointermove",
    dragPoint
  );

  window.addEventListener(
    "pointerup",
    stopDrag
  );

  window.addEventListener(
    "pointercancel",
    stopDrag
  );
}


/* =====================================================
   PUNKT BEWEGEN
===================================================== */

function dragPoint(event){

  if(draggingPoint === null){
    return;
  }

  const svg =
    document.getElementById("garmentSvg");

  const rect =
    svg.getBoundingClientRect();

  const scaleX =
    400 / rect.width;

  const scaleY =
    540 / rect.height;

  let x =
    (event.clientX - rect.left) * scaleX;

  let y =
    (event.clientY - rect.top) * scaleY;

  x =
    Math.max(
      20,
      Math.min(380,x)
    );

  y =
    Math.max(
      20,
      Math.min(520,y)
    );

  points[draggingPoint].x = x;
  points[draggingPoint].y = y;

  drawGarment();
}


/* =====================================================
   DRAG ENDE
===================================================== */

function stopDrag(){

  draggingPoint = null;

  window.removeEventListener(
    "pointermove",
    dragPoint
  );

  window.removeEventListener(
    "pointerup",
    stopDrag
  );

  window.removeEventListener(
    "pointercancel",
    stopDrag
  );
}


/* =====================================================
   FARBE
===================================================== */

/* =====================================================
   MUSTER
===================================================== */

function setPattern(pattern){

  currentPattern =
    pattern;

  updatePatternShape();
}


function updatePatternShape(){

  const overlay =
    document.getElementById(
      "patternOverlay"
    );

  overlay.className =
    "pattern-overlay";

  if(currentPattern !== "none"){
    overlay.classList.add(
      "pattern-"+currentPattern
    );
  }

  /*
    SVG clip-path wird nicht benötigt,
    weil das Muster als Overlay
    über dem Kleidungsstück liegt.
  */
}

function saveDesign(){

  const data = {

      currentGarment,

    style:
      currentStyle,

    color:

    pattern:
      currentPattern,

    sticker:
      currentSticker,

    text:
      currentText,

    points:
      points,

    scale:

  };

  localStorage.setItem(
    "arveDesign",
    JSON.stringify(data)
  );

  alert(
    "Arvé Design gespeichert."
  );
}


/* =====================================================
   LADEN
===================================================== */

function loadDesign(){

  const saved =
    localStorage.getItem(
      "arveDesign"
    );

  if(!saved){

    alert(
      "Noch kein Design gespeichert."
    );

    return;
  }

  try{

    const data =
      JSON.parse(saved);

    currentGarment =
      data.garment || "shirt";

    currentStyle =
      data.style || "classic";

    currentColor =
      data.color || "#eee6d4";

    currentPattern =
      data.pattern || "none";

    currentSticker =
      data.sticker || "";

    currentText =
      data.text || "";

    garmentScale =
      data.scale || 1;

    if(
      !styleNames[currentGarment] ||
      !styleNames[currentGarment][currentStyle]
    ){

      currentStyle =
        Object.keys(
          styleNames[currentGarment]
        )[0];
    }

    points =
      Array.isArray(data.points)
        ? data.points.map(point=>({
            x:Number(point.x),
            y:Number(point.y)
          }))
        : getStylePoints().map(point=>({...point}));

    document.querySelectorAll(
      ".tool-btn"
    ).forEach(btn=>{
      btn.classList.remove("active");
    });

    if(currentGarment === "pants"){

      document.getElementById(
        "pantsButton"
      ).classList.add("active");

    }else if(currentGarment === "formal"){

      document.getElementById(
        "formalButton"
      ).classList.add("active");

    }else{

      document.getElementById(
        "shirtButton"
      ).classList.add("active");
    }

    document.getElementById(
      "textInput"
    ).value =
      currentText;

    document.getElementById(
      "colorPicker"
    ).value =
      currentColor;

    document.querySelector(
      ".garment-wrap"
    ).style.transform =
      `scale(${garmentScale})`;

    renderStyleButtons();

    setPattern(currentPattern);
    setSticker(currentSticker);

    drawGarment();

  }catch(error){

    alert(
      "Das gespeicherte Design konnte nicht geladen werden."
    );
  }
}

  document.getElementById(

  drawGarment();
}
